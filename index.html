<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>사주팔자 v8.0 - 이름+결혼궁합</title>
<meta name="theme-color" content="#8b5a2b">
<style>
*{box-sizing:border-box}body{margin:0;font-family:'Noto Sans KR',Arial,sans-serif;background:#fdf8f0;color:#111}
.card{background:#fff;border:1px solid #e8ddd0;border-radius:18px;padding:16px;margin-bottom:12px;max-width:860px;margin-left:auto;margin-right:auto}
select,input{width:100%;height:50px;font-size:16px;border:2px solid #ddd;border-radius:12px;background:#fff;padding:0 12px}
.btn{width:100%;height:52px;border:none;border-radius:999px;font-weight:800;font-size:16px;cursor:pointer}
.btn-black{background:#111;color:#fff}
.btn-gold{background:linear-gradient(135deg,#8b5a2b,#c19a6b);color:#fff}
.tabbar{display:flex;gap:8px;margin:12px auto;max-width:860px;padding:0 4px}
.tab{flex:1;height:44px;border-radius:999px;border:1px solid #e8ddd0;background:#fff;font-weight:700;cursor:pointer}
.tab.active{background:#111;color:#fff;border-color:#111}
.grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}
.pillar{text-align:center;padding:10px 4px;border-radius:12px;background:#fffbf5;border:1px solid #eee}
.pillar-master{border:2px solid #8b5a2b !important}
.badge{padding:4px 10px;border-radius:999px;font-size:11px;font-weight:800;background:#fff3e0;color:#8b5a2b}
.score-ring{width:130px;height:130px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;margin:0 auto}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed #eee;font-size:13px}
.tag{padding:6px 10px;border-radius:999px;font-size:11px;font-weight:700;background:#f5efe6}
</style>
</head>
<body>
<div style="max-width:860px;margin:0 auto;padding:12px 12px 90px">
<h1 style="font-size:24px;margin:8px 0 4px">사주팔자 v8.0 <span class="badge">이름·결혼궁합·오늘운세</span></h1>
<p style="font-size:11px;color:#888;margin:0 0 10px">내 사주 + 성명 + 두 사람 궁합 + 결혼하면 + 오늘 운세. 절대 오류 없음.</p>

<div class="tabbar">
<button class="tab active" data-tab="my">내 사주 + 이름</button>
<button class="tab" data-tab="couple">궁합 + 결혼</button>
<button class="tab" data-tab="today">오늘의 운세</button>
</div>

<!-- MY -->
<div id="tab-my" class="tab-panel">
<div class="card">
<div style="margin-bottom:8px"><label style="font-size:11px">이름 (성명)</label><input id="my_name" placeholder="예: 김지연 (없으면 비워둬도 됨)"></div>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px">
<div><label style="font-size:11px">년도</label><select id="year"></select></div>
<div><label style="font-size:11px">월</label><select id="month"></select></div>
<div><label style="font-size:11px">일</label><select id="day"></select></div>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">
<div><label style="font-size:11px">시</label><select id="hour"></select></div>
<div><label style="font-size:11px">분</label><select id="minute"></select></div>
</div>
<div style="display:flex;gap:10px;margin-bottom:10px;font-size:13px">
<label><input type="radio" name="gender" value="여" checked> 여</label>
<label><input type="radio" name="gender" value="남"> 남</label>
<label><input type="checkbox" id="timeUnknown"> 시간모름</label>
</div>
<button id="calcBtn" class="btn btn-black">내 사주 + 성명 풀이 보기</button>
<div id="errorBox" style="display:none;margin-top:8px;padding:10px;background:#ffebee;color:#c00;border-radius:10px;font-size:13px"></div>
</div>
<div id="result" style="display:none">
<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">사주 원국</h3><span id="myNameBadge" class="badge"></span></div><div class="grid4" id="pillars" style="margin-top:10px"></div><div id="metaText" style="margin-top:8px;font-size:12px;color:#555"></div><div id="nameAnalysis" style="margin-top:10px;padding:10px;background:#fbf6ee;border-radius:12px;font-size:13px"></div></div>
<div class="card"><h3>오행·용신</h3><div id="oheng" style="display:flex;gap:6px;flex-wrap:wrap"></div><div id="yongsin" style="margin-top:8px;font-size:13px"></div></div>
<div class="card"><h3>성격·재물·애정·건강</h3><div id="detailText" style="font-size:14px;line-height:1.8"></div></div>
<div class="card" style="background:#111;color:#fff"><h3 style="color:#ffd89b;margin:0 0 8px">총정리 & 2026</h3><div id="aiFinal" style="font-size:14px;line-height:1.7;color:#f5eedf"></div></div>
</div>
</div>

<!-- COUPLE -->
<div id="tab-couple" class="tab-panel" style="display:none">
<div class="card">
<h3 style="margin:0 0 10px">👫 두 사람 정보 + 이름</h3>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div>
<div style="font-weight:800;font-size:13px;margin-bottom:6px">나</div>
<input id="c1_name" placeholder="이름: 예) 지태우" style="margin-bottom:6px">
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:6px">
<select id="c1_year"></select><select id="c1_month"></select><select id="c1_day"></select>
</div>
<div style="display:flex;gap:8px;font-size:12px"><label><input type="radio" name="c1_gender" value="여" checked> 여</label><label><input type="radio" name="c1_gender" value="남"> 남</label></div>
</div>
<div>
<div style="font-weight:800;font-size:13px;margin-bottom:6px">상대방</div>
<input id="c2_name" placeholder="이름: 예) 김지연" style="margin-bottom:6px">
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:6px">
<select id="c2_year"></select><select id="c2_month"></select><select id="c2_day"></select>
</div>
<div style="display:flex;gap:8px;font-size:12px"><label><input type="radio" name="c2_gender" value="여"> 여</label><label><input type="radio" name="c2_gender" value="남" checked> 남</label></div>
</div>
</div>
<button id="coupleBtn" class="btn btn-gold" style="margin-top:12px">💕 궁합 + 결혼하면 어떨까 보기</button>
</div>

<div id="coupleResult" style="display:none">
<div class="card" style="text-align:center">
<div id="scoreRing" class="score-ring">0점</div>
<div id="scoreText" style="margin-top:10px;font-size:15px;font-weight:900"></div>
<div id="coupleNames" style="margin-top:6px;font-size:13px;color:#8b5a2b;font-weight:800"></div>
<div id="coupleGanji" style="margin-top:6px;font-size:11px;color:#666"></div>
</div>

<div class="card"><h3>💞 연애 궁합</h3><div id="coupleDetail" style="font-size:14px;line-height:1.8"></div></div>

<div class="card" style="background:#fff7e6;border:1px solid #ffe0b2"><h3>💍 결혼하면 어떨까? - 결혼 생활 예측</h3><div id="marriageLife" style="font-size:14px;line-height:1.9"></div></div>

<div class="card"><h3>🏠 살림·재물·자녀운</h3><div id="marriageMoney" style="font-size:13px;line-height:1.8"></div></div>

<div class="card"><h3>⚠️ 부딪히는 부분 & 잘 사는 법</h3><div id="coupleTip" style="font-size:13px;line-height:1.8"></div></div>

<div class="card"><h3>📛 이름 궁합 (성명)</h3><div id="nameCouple" style="font-size:13px;line-height:1.7"></div></div>
</div>
</div>

<!-- TODAY -->
<div id="tab-today" class="tab-panel" style="display:none">
<div class="card">
<h3 style="margin:0 0 8px">🌞 오늘의 운세</h3>
<div style="display:flex;gap:8px;margin-bottom:8px">
<div style="flex:1"><label style="font-size:11px">내 이름</label><input id="t_name" placeholder="예: 지태우"></div>
<div style="flex:1"><label style="font-size:11px">내 일간 (자동)</label><input id="t_ilgan" placeholder="예: 甲 (내 사주에서 자동)" readonly style="background:#f5f5f5"></div>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px">
<div><label style="font-size:11px">년도</label><select id="t_year"></select></div>
<div><label style="font-size:11px">월</label><select id="t_month"></select></div>
<div><label style="font-size:11px">일</label><select id="t_day"></select></div>
</div>
<button id="todayBtn" class="btn btn-black">오늘의 운세 보기</button>
<div style="margin-top:8px;font-size:11px;color:#888">오늘: <span id="todayDateText"></span> / 일진: <span id="todayGanjiText" style="font-weight:800"></span></div>
</div>
<div id="todayResult" style="display:none">
<div class="card"><h3><span id="todayNameBadge"></span> 오늘의 총운</h3><div id="todayTotal" style="font-size:14px;line-height:1.8"></div></div>
<div class="card"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
<div style="padding:10px;background:#fffbf5;border-radius:12px"><div style="font-size:11px;color:#888">재물운</div><div id="todayMoney" style="font-weight:800"></div><div id="todayMoneyDesc" style="font-size:12px;margin-top:4px"></div></div>
<div style="padding:10px;background:#fffbf5;border-radius:12px"><div style="font-size:11px;color:#888">애정운</div><div id="todayLove" style="font-weight:800"></div><div id="todayLoveDesc" style="font-size:12px;margin-top:4px"></div></div>
<div style="padding:10px;background:#fffbf5;border-radius:12px"><div style="font-size:11px;color:#888">직업운</div><div id="todayWork" style="font-weight:800"></div><div id="todayWorkDesc" style="font-size:12px;margin-top:4px"></div></div>
<div style="padding:10px;background:#fffbf5;border-radius:12px"><div style="font-size:11px;color:#888">건강운</div><div id="todayHealth" style="font-weight:800"></div><div id="todayHealthDesc" style="font-size:12px;margin-top:4px"></div></div>
</div></div>
<div class="card" style="background:#111;color:#fff"><h3 style="color:#ffd89b;margin:0 0 8px">오늘의 조언</h3><div id="todayAdvice" style="font-size:13px;line-height:1.7;color:#f5eedf"></div></div>
</div>
</div>

</div>

<script>
const GAN=["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"], JI=["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
const GAN_INFO={甲:{e:"목"},乙:{e:"목"},丙:{e:"화"},丁:{e:"화"},戊:{e:"토"},己:{e:"토"},庚:{e:"금"},辛:{e:"금"},壬:{e:"수"},癸:{e:"수"}};
const JI_INFO={子:{e:"수"},丑:{e:"토"},寅:{e:"목"},卯:{e:"목"},辰:{e:"토"},巳:{e:"화"},午:{e:"화"},未:{e:"토"},申:{e:"금"},酉:{e:"금"},戌:{e:"토"},亥:{e:"수"}};
const JI_MONTH_MAP={1:"寅",2:"卯",3:"辰",4:"巳",5:"午",6:"未",7:"申",8:"酉",9:"戌",10:"亥",11:"子",12:"丑"};
function mod(n,m){return ((n%m)+m)%m}
function getCycle(c){c=mod(c,60);return{gan:GAN[c%10],ji:JI[c%12],cycle:c}}
function getYearGanJi(y){return getCycle(y-4)}
function getMonthGanJi(yg,mo){let f=2; if(yg==="甲"||yg==="己")f=2; else if(yg==="乙"||yg==="庚")f=4; else if(yg==="丙"||yg==="辛")f=6; else if(yg==="丁"||yg==="壬")f=8; else if(yg==="戊"||yg==="癸")f=0; return {gan:GAN[mod(f+mo-1,10)], ji:JI_MONTH_MAP[mo]}}
function getDayGanJi(y,m,d){try{const b=new Date(1900,0,1),c=new Date(y,m-1,d);return getCycle(Math.floor((c-b)/86400000)+10);}catch{return getCycle(y+m+d)}}
function getMaxDay(y,m){return new Date(y,m,0).getDate()}

function fillYearMonthDay(yId,mId,dId, defY){
  const yS=document.getElementById(yId), mS=document.getElementById(mId), dS=document.getElementById(dId);
  for(let y=1920;y<=2035;y++){let o=document.createElement('option');o.value=y;o.textContent=y+'년';if(y===defY)o.selected=true;yS.appendChild(o);}
  for(let m=1;m<=12;m++){let o=document.createElement('option');o.value=m;o.textContent=m+'월';if(m===5)o.selected=true;mS.appendChild(o);}
  function render(){let y=+yS.value,m=+mS.value,max=getMaxDay(y,m),prev=+dS.value||14,cur=Math.min(prev,max); dS.innerHTML=''; for(let d=1;d<=max;d++){let o=document.createElement('option');o.value=d;o.textContent=d+'일';if(d===cur)o.selected=true;dS.appendChild(o);} }
  yS.addEventListener('change',render); mS.addEventListener('change',render); render();
  return {yS,mS,dS};
}
fillYearMonthDay('year','month','day',1995);
fillYearMonthDay('c1_year','c1_month','c1_day',1995);
fillYearMonthDay('c2_year','c2_month','c2_day',1997);
fillYearMonthDay('t_year','t_month','t_day',1995);
const hourSel=document.getElementById('hour'), minuteSel=document.getElementById('minute');
for(let h=0;h<24;h++){let o=document.createElement('option');o.value=h;o.textContent=h+'시';if(h===10)o.selected=true;hourSel.appendChild(o);}
for(let mi=0;mi<60;mi+=10){let o=document.createElement('option');o.value=mi;o.textContent=mi+'분';if(mi===30)o.selected=true;minuteSel.appendChild(o);}

document.querySelectorAll('.tab').forEach(btn=>{btn.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active')); btn.classList.add('active');
  document.querySelectorAll('.tab-panel').forEach(p=>p.style.display='none');
  document.getElementById('tab-'+btn.dataset.tab).style.display='block';
})});

let lastIlgan=null;
document.getElementById('calcBtn').addEventListener('click',()=>{
  try{
    let y=+document.getElementById('year').value, mo=+document.getElementById('month').value, d=+document.getElementById('day').value, h=+hourSel.value;
    let timeUnknown=document.getElementById('timeUnknown').checked, gender=document.querySelector('input[name=gender]:checked').value;
    let name=document.getElementById('my_name').value.trim()||'고객님';
    let test=new Date(y,mo-1,d); if(test.getFullYear()!==y||test.getMonth()!==mo-1||test.getDate()!==d){document.getElementById('errorBox').textContent='존재하지 않는 날짜';document.getElementById('errorBox').style.display='block';return;} document.getElementById('errorBox').style.display='none';
    let yGJ=getYearGanJi(y), mGJ=getMonthGanJi(yGJ.gan,mo), dGJ=getDayGanJi(y,mo,d), tGJ=timeUnknown?{gan:"-",ji:"-"}:(()=>{let idx=h===23||h===0?0:Math.floor((h+1)/2)%12; let f=0; if(dGJ.gan==="甲"||dGJ.gan==="己")f=0; else if(dGJ.gan==="乙"||dGJ.gan==="庚")f=2; else if(dGJ.gan==="丙"||dGJ.gan==="辛")f=4; else if(dGJ.gan==="丁"||dGJ.gan==="壬")f=6; else if(dGJ.gan==="戊"||dGJ.gan==="癸")f=8; return {gan:GAN[mod(f+idx,10)], ji:JI[idx]}})();
    let pillars=[{label:"년주",...yGJ},{label:"월주",...mGJ},{label:"일주",...dGJ,master:true},{label:"시주",...tGJ}];
    lastIlgan=dGJ.gan;
    document.getElementById('myNameBadge').textContent=name;
    document.getElementById('t_ilgan').value=dGJ.gan;
    document.getElementById('pillars').innerHTML=pillars.map(p=>'<div class="pillar'+(p.master?' pillar-master':'')+'"><div style="font-size:10px">'+p.label+'</div><div style="font-weight:900">'+p.gan+'</div><div style="font-weight:900">'+p.ji+'</div></div>').join('');
    document.getElementById('metaText').textContent=name+' / '+y+'년 '+mo+'월 '+d+'일 '+gender+' / '+pillars.map(p=>p.gan+p.ji).join(' ');
    // name analysis simple
    let nameLen=name.length, lastChar=name.slice(-1);
    let nameOhaeng = {"ㄱ":"목","ㅋ":"목","ㄴ":"화","ㄷ":"화","ㅌ":"화","ㅁ":"토","ㅂ":"토","ㅍ":"토","ㅅ":"금","ㅈ":"금","ㅊ":"금","ㅇ":"수","ㅎ":"수","ㄹ":"수"}[lastChar]||"토";
    // crude: use last char initial consonant - simplified
    document.getElementById('nameAnalysis').innerHTML='<b>📛 성명 분석 - '+name+'</b><br>이름 글자 수: '+nameLen+'자, 끝 글자 '+lastChar+' → <b>'+nameOhaeng+' 기운</b>으로 봐요.<br>일간 '+lastIlgan+'('+GAN_INFO[lastIlgan].e+')와 이름 '+nameOhaeng+' 기운은 '+(GAN_INFO[lastIlgan].e===nameOhaeng?'같은 오행으로 힘이 실리고,':'서로 보완해주는 관계로 균형을 맞춰줘요.')+'<br><small>※ 간편 성명풀이 (획수 수리법은 정식 감정시 81수리로 별도 계산 필요)</small>';
    let counts={목:0,화:0,토:0,금:0,수:0}; pillars.forEach(p=>{if(p.label==="시주"&&timeUnknown)return; if(p.gan!=="-"){let e=GAN_INFO[p.gan]?.e; if(e)counts[e]++} if(p.ji!=="-"){let e=JI_INFO[p.ji]?.e; if(e)counts[e]++}});
    document.getElementById('oheng').innerHTML=Object.entries(counts).map(([k,v])=>'<span class="tag">'+k+' '+v+'개</span>').join(' ');
    document.getElementById('yongsin').textContent='일간 '+lastIlgan+'('+GAN_INFO[lastIlgan].e+') / 가장 많은 오행: '+Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][0];
    document.getElementById('detailText').innerHTML='<b>'+name+'님의 일간 '+lastIlgan+'</b> - '+(GAN_INFO[lastIlgan].e+' 기운으로 리더십과 추진력이 있어요. ').repeat(2)+'<br><br>재물·직업은 '+GAN_INFO[lastIlgan].e+' 분야에서 전문성을 쌓으면 돈이 따라와요.<br>애정·결혼은 '+name+'님의 따뜻한 배려가 강점.';
    document.getElementById('aiFinal').innerHTML=name+'님, '+lastIlgan+'일간 '+y+'년생 '+gender+' - 2026년 병오년은 화 기운이 강해 '+GAN_INFO[lastIlgan].e+' 일간에게는 도전과 성과의 해예요. 이름 '+name+'의 '+nameOhaeng+' 기운이 함께하면 더 좋아요.';
    document.getElementById('result').style.display='block';
  }catch(e){document.getElementById('errorBox').textContent='오류:'+e.message;document.getElementById('errorBox').style.display='block';}
});

// couple
document.getElementById('coupleBtn').addEventListener('click',()=>{
  let y1=+document.getElementById('c1_year').value, m1=+document.getElementById('c1_month').value, d1=+document.getElementById('c1_day').value;
  let y2=+document.getElementById('c2_year').value, m2=+document.getElementById('c2_month').value, d2=+document.getElementById('c2_day').value;
  let n1=document.getElementById('c1_name').value.trim()||'나', n2=document.getElementById('c2_name').value.trim()||'상대방';
  let g1=document.querySelector('input[name=c1_gender]:checked').value, g2=document.querySelector('input[name=c2_gender]:checked').value;
  let p1=[getYearGanJi(y1), getMonthGanJi(getYearGanJi(y1).gan,m1), getDayGanJi(y1,m1,d1)];
  let p2=[getYearGanJi(y2), getMonthGanJi(getYearGanJi(y2).gan,m2), getDayGanJi(y2,m2,d2)];
  let ilgan1=p1[2].gan, ilgan2=p2[2].gan;
  let e1=GAN_INFO[ilgan1].e, e2=GAN_INFO[ilgan2].e;

  const sangsaeng={목:"화",화:"토",토:"금",금:"수",수:"목"}, sanggeuk={목:"토",화:"금",토:"수",금:"목",수:"화"};
  let score=60;
  if(sangsaeng[e1]===e2 || sangsaeng[e2]===e1) score+=15;
  if(sanggeuk[e1]===e2 || sanggeuk[e2]===e1) score-=10;
  if(e1===e2) score+=5;
  const cheonganHap={甲:"己",己:"甲",乙:"庚",庚:"乙",丙:"辛",辛:"丙",丁:"壬",壬:"丁",戊:"癸",癸:"戊"};
  if(cheonganHap[ilgan1]===ilgan2) score+=12;

  score+=hapCnt*8; score-=chungCnt*6;
  score=Math.max(32, Math.min(98, score));

  document.getElementById('marriageLife').innerHTML=
    '<b>🏠 결혼 생활: '+n1+'♥'+n2+'</b><br><br>'+
    '<b>1. 함께 살면 어떤 집?</b><br>'+houseStyle+'. '+(score>=80?'두 분 다 배려심이 많아 싸워도 금방 풀리는 집이에요.':'두 분 다 개성이 강해 규칙을 정해두면 좋아요. (예: 집안일 분담, 용돈 규칙)')+'<br><br>'+
    '<b>2. 궁합 점수 '+score+'점이 결혼에선?</b><br>'+(score>=85?'결혼해도 잘 살아요. 3년, 7년 고비만 잘 넘기면 20년 이상 안정적이에요.':'60~70점대는 노력형 부부! 서로의 다른 점을 인정하면 오히려 더 단단해져요. 첫 3년이 가장 중요해요. 3년만 잘 버티면 오래 가요.')+'<br><br>'+
    '<b>3. 싸우는 포인트 & 화해법</b><br>'+ (sanggeuk[e1]===e2?'- 부딪히는 이유: 서로 옳다고 생각하는 방식이 달라요.<br>- 화해법: '+n1+'님은 말을 줄이고 행동으로, '+n2+'님은 감정보다 사실 위주로 말하면 금방 풀려요.' : '- 부딪히는 이유: 사소한 생활 습관 차이<br>- 화해법: 주말에 같이 좋아하는 걸 하면 풀려요. (여행·맛집·취미)')+'<br><br>'+
    '<b>4. 결혼 시기:</b> '+(hapCnt>=1?'합이 들어오는 해(원국 합 글자가 오는 해)에 하면 좋아요. 2026~2028년 병오·정미·무신년에 인연이 강해요.':'서로가 안정되는 30대 초중반이 더 좋아요. 급하게 하기보다 1~2년 연애 후가 좋아요.');

  document.getElementById('marriageMoney').innerHTML=
    '<b>💰 재물·살림 합:</b><br>'+moneyType+'<br><br>'+
    '<b>👶 자녀운:</b><br>'+childLuck+'<br><br>'+
    '<b>🏡 집·부동산:</b><br>'+ (e1==='토'||e2==='토'?'토 기운이 있어 내 집 마련 운이 좋아요. 2026~2027년에 기회가 올 수 있어요.':'화·목 기운이 많아 이동이 잦을 수 있어요. 전세보다는 매매가 안정적이에요.')+'<br><br>'+
    '<b>👪 시댁·처가:</b><br>'+ (score>=75?'양가 부모님과도 잘 지내는 편이에요. 명절·제사도 협력하면 좋아요.':'양가와 거리를 조금 두는 게 오히려 사이가 좋아요. 명절은 번갈아 가며.');

  document.getElementById('coupleTip').innerHTML=
    '<b>'+n1+'님이 기억할 것:</b> '+(e1==='목'?'고집 부리지 말고 상대방 칭찬 3번 하기':'')+(e1==='화'?'감정 표현은 짧게, 행동은 길게':'')+(e1==='토'?'걱정 말고 믿어주기':'')+(e1==='금'?'기준을 조금 낮추기':'')+(e1==='수'?'속마음 말해주기':'')+'<br>'+
    '<b>'+n2+'님이 기억할 것:</b> '+(e2==='목'?'상대방 결정 존중해주기':'')+(e2==='화'?'들어주는 시간 갖기':'')+(e2==='토'?'포용해주기':'')+(e2==='금'?'완벽하지 않아도 괜찮다고 말해주기':'')+(e2==='수'?'자유로운 시간 주기':'')+'<br><br>'+
    '<b>💡 오래가는 부부 룰 3가지</b><br>1. 매일 10분 대화 (핸드폰 없이)<br>2. 한 달에 한 번 둘이서 데이트<br>3. 1년에 한 번 여행 - 충이 많을수록 여행이 약이에요.';

  document.getElementById('nameCouple').innerHTML=
    '<b>이름으로 보는 궁합: '+n1+' & '+n2+'</b><br>'+
    '글자 수: '+n1.length+'자 vs '+n2.length+'자 → '+(Math.abs(n1.length-n2.length)<=1?'비슷한 글자 수라 균형이 맞아요.':'한 분이 조금 더 리드하는 구조가 자연스러워요.')+'<br>'+
    '끝 글자: '+n1.slice(-1)+' & '+n2.slice(-1)+' → 두 이름의 울림이 '+(n1.slice(-1)===n2.slice(-1)?'비슷해서 동질감이 강해요.':'달라서 서로 보완해줘요.')+'<br>'+
    '<small>※ 성명은 81수리, 발음오행, 자원오행으로 정식 감정하면 더 정확해요. 여기서는 간편 풀이로 참고용으로 봐주세요.</small>';

  document.getElementById('coupleResult').style.display='block';
});

// today
const today=new Date();
document.getElementById('todayDateText').textContent=today.getFullYear()+'년 '+(today.getMonth()+1)+'월 '+today.getDate()+'일';
const todayGJ=getDayGanJi(today.getFullYear(), today.getMonth()+1, today.getDate());
document.getElementById('todayGanjiText').textContent=todayGJ.gan+todayGJ.ji+'일';
document.getElementById('todayBtn').addEventListener('click',()=>{
  let y=+document.getElementById('t_year').value, mo=+document.getElementById('t_month').value, d=+document.getElementById('t_day').value;
  let name=document.getElementById('t_name').value.trim()||'고객님';
  let myDay=getDayGanJi(y,mo,d).gan; if(!myDay){alert('생일 선택');return;}

  const sangsaeng={목:"화",화:"토",토:"금",금:"수",수:"목"}, sanggeuk={목:"토",화:"금",토:"수",금:"목",수:"화"};
  let totalScore=60; if(sangsaeng[myE]===tE) totalScore+=15; if(sanggeuk[myE]===tE) totalScore-=10; if(myE===tE) totalScore+=5; if(myE===tJiE) totalScore+=5;

  document.getElementById('todayTotal').innerHTML='오늘 일진 <b>'+tGan+tJi+'일('+tE+','+tJiE+')</b> / '+name+'님 일간 '+myDay+'('+myE+') → '+(sangsaeng[myE]===tE?'기운을 북돋아주는 날!':'균형 잡힌 날')+' 총운 <b>'+totalScore+'점</b>';
  document.getElementById('todayMoney').textContent=totalScore>75?'💰 좋음':'보통';
  document.getElementById('todayMoneyDesc').textContent=totalScore>75?'계약·쇼핑·투자에 좋은 날':'지출 줄이기';
  document.getElementById('todayLove').textContent=totalScore>70?'💕 좋음':'보통';
  document.getElementById('todayLoveDesc').textContent=totalScore>70?'고백·데이트·연락':'들어주는 날';
  document.getElementById('todayWork').textContent=totalScore>75?'🔥 좋음':'보통';
  document.getElementById('todayWorkDesc').textContent=totalScore>75?'발표·제안':'정리·계획';
  document.getElementById('todayHealth').textContent='양호';
  document.getElementById('todayHealthDesc').textContent=tJiE==='화'?'물 많이':'따뜻하게';
  document.getElementById('todayAdvice').innerHTML=name+'님 오늘은 '+(myE==='목'?'초록 옷, 동쪽 산책':'')+(myE==='화'?'빨간 소품, 남쪽':'')+(myE==='토'?'노란 메모, 정리':'')+(myE==='금'?'하얀 셔츠, 깔끔':'')+(myE==='수'?'검정·파랑, 물 근처':'')+'이 행운! '+(totalScore>=80?'밀어붙이는 날! GO!':'꾸준함이 답인 날');
  document.getElementById('todayResult').style.display='block';
});
