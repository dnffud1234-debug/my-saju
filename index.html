}

// ===== 사주 계산 로직 (따옴표로 안전하게) =====
var GAN=["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"];
var JI=["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
var GAN_INFO={"甲":{e:"목"},"乙":{e:"목"},"丙":{e:"화"},"丁":{e:"화"},"戊":{e:"토"},"己":{e:"토"},"庚":{e:"금"},"辛":{e:"금"},"壬":{e:"수"},"癸":{e:"수"}};
var JI_INFO={"子":{e:"수"},"丑":{e:"토"},"寅":{e:"목"},"卯":{e:"목"},"辰":{e:"토"},"巳":{e:"화"},"午":{e:"화"},"未":{e:"토"},"申":{e:"금"},"酉":{e:"금"},"戌":{e:"토"},"亥":{e:"수"}};
var JI_MONTH_MAP={1:"寅",2:"卯",3:"辰",4:"巳",5:"午",6:"未",7:"申",8:"酉",9:"戌",10:"亥",11:"子",12:"丑"};
function mod(n,m){return ((n%m)+m)%m;}
function getCycle(c){c=mod(c,60);return{gan:GAN[c%10],ji:JI[c%12],cycle:c};}
function getYearGanJi(y){return getCycle(y-4);}
function getMonthGanJi(yg,mo){var f=2; if(yg==="甲"||yg==="己")f=2; else if(yg==="乙"||yg==="庚")f=4; else if(yg==="丙"||yg==="辛")f=6; else if(yg==="丁"||yg==="壬")f=8; else if(yg==="戊"||yg==="癸")f=0; return{gan:GAN[mod(f+mo-1,10)], ji:JI_MONTH_MAP[mo]};}
function getDayGanJi(y,m,d){try{var b=new Date(1900,0,1),c=new Date(y,m-1,d);return getCycle(Math.floor((c-b)/86400000)+10);}catch(e){return getCycle(y+m+d);}}
function getMaxDay(y,m){return new Date(y,m,0).getDate();}
function getCounts(pillars){var c={목:0,화:0,토:0,금:0,수:0}; for(var i=0;i<pillars.length;i++){var p=pillars[i]; if(p.gan!=="-"&&GAN_INFO[p.gan])c[GAN_INFO[p.gan].e]++; if(p.ji!=="-"&&JI_INFO[p.ji])c[JI_INFO[p.ji].e]++;} return c;}
function getSinGang(counts, dayE, monthJi){var monthE=JI_INFO[monthJi]?JI_INFO[monthJi].e:null; var support=counts[dayE]+ (counts[{목:"수",화:"목",토:"화",금:"토",수:"금"}[dayE]]||0)*0.7; if(monthE===dayE) support+=1.5; var total=0; for(var k in counts){total+=counts[k];} return support >= total*0.45 ? "신강" : "신약";}

// ===== 내 사주 버튼 =====
function calcMy(){
  try{
    var y=parseInt(document.getElementById('year').value), mo=parseInt(document.getElementById('month').value), d=parseInt(document.getElementById('day').value), h=parseInt(document.getElementById('hour').value);
    var timeUnknown=document.getElementById('timeUnknown').checked;
    var gender=document.querySelector('input[name=gender]:checked').value;
    var name=document.getElementById('my_name').value.trim()||'고객님';
    var yGJ=getYearGanJi(y), mGJ=getMonthGanJi(yGJ.gan,mo), dGJ=getDayGanJi(y,mo,d);
    var tGJ;
    if(timeUnknown){tGJ={gan:"-",ji:"-"};}else{var idx=(h===23||h===0)?0:Math.floor((h+1)/2)%12; var f=0; if(dGJ.gan==="甲"||dGJ.gan==="己")f=0; else if(dGJ.gan==="乙"||dGJ.gan==="庚")f=2; else if(dGJ.gan==="丙"||dGJ.gan==="辛")f=4; else if(dGJ.gan==="丁"||dGJ.gan==="壬")f=6; else if(dGJ.gan==="戊"||dGJ.gan==="癸")f=8; tGJ={gan:GAN[mod(f+idx,10)], ji:JI[idx]};}
    var pillars=[{label:"년주",gan:yGJ.gan,ji:yGJ.ji},{label:"월주",gan:mGJ.gan,ji:mGJ.ji},{label:"일주",gan:dGJ.gan,ji:dGJ.ji,master:true},{label:"시주",gan:tGJ.gan,ji:tGJ.ji}];
    var dayE=GAN_INFO[dGJ.gan].e;
    var counts=getCounts(pillars);
    var sinGang=getSinGang(counts, dayE, mGJ.ji);
    var sorted=[]; for(var k in counts){sorted.push([k,counts[k]]);} sorted.sort(function(a,b){return b[1]-a[1];});
    var htmlPillars=""; for(var i=0;i<pillars.length;i++){var p=pillars[i]; htmlPillars+='<div class="pillar"><div style="font-size:10px">'+p.label+'</div><div style="font-weight:900">'+p.gan+'</div><div style="font-weight:900">'+p.ji+'</div></div>';}
    document.getElementById('pillars').innerHTML=htmlPillars;
    document.getElementById('metaText').textContent=name+' / '+y+'년 '+mo+'월 '+d+'일 '+gender+' / '+yGJ.gan+yGJ.ji+' '+mGJ.gan+mGJ.ji+' '+dGJ.gan+dGJ.ji+' '+tGJ.gan+tGJ.ji+' / '+sinGang;
    var most=sorted[0][0], least=sorted[sorted.length-1][0];
    var yongsin = sinGang==='신강' ? {목:"금",화:"토",토:"수",금:"화",수:"목"}[dayE] : {목:"수",화:"목",토:"화",금:"토",수:"금"}[dayE];
    document.getElementById('sinGang').innerHTML='<b>신강/신약: '+sinGang+'</b> - 일간 '+dGJ.gan+'('+dayE+')가 월지 '+mGJ.ji+'('+JI_INFO[mGJ.ji].e+')에서 '+(JI_INFO[mGJ.ji].e===dayE?'득령':'실령')+'하고, 전체에서 '+dayE+'가 '+counts[dayE]+'개라 '+(sinGang==='신강'?'강해요 - 추진력·독립심 강함':'약해요 - 협력·인덕 필요');
    document.getElementById('yongsin').innerHTML='<b>용신: '+yongsin+'</b> - 가장 적은 '+least+'도 채우면 좋음. 대운에서 '+yongsin+' 오는 10년이 기회!';
    document.getElementById('detailText').innerHTML='<b>'+dGJ.gan+'일간 '+sinGang+'</b> - '+(sinGang==='신강'?'추진력·독립심·리더십 강함, 고집만 내려놓으면 100점':'협력·배려·섬세함·인덕 강함, 멘토·팀 찾으면 대성')+'<br><br><b>월지 '+mGJ.ji+' 영향:</b> '+(mGJ.ji==='寅'||mGJ.ji==='卯'?'봄 - 성장·시작':mGJ.ji==='巳'||mGJ.ji==='午'?'여름 - 열정·표현':mGJ.ji==='申'||mGJ.ji==='酉'?'가을 - 결실·완성':'겨울 - 지혜·저장')+'<br><br><b>재물:</b> '+(sinGang==='신강'?'쟁취형 - 경쟁·사업·투자 강함':'기술·전문성으로 버는 구조')+'<br><b>애정:</b> 일지 '+dGJ.ji+'('+JI_INFO[dGJ.ji].e+')가 배우자 자리<br><b>건강:</b> '+dayE+' → '+(dayE==='목'?'간·담·어깨':dayE==='화'?'심장·눈':dayE==='토'?'위·소화기':dayE==='금'?'폐·피부':'신장·허리')+' 주의';
    document.getElementById('aiFinal').innerHTML=name+'님 '+dGJ.gan+'일간 '+sinGang+' / 용신 '+yongsin+'<br>2026 병오년은 화 최강 해 - '+(dayE==='목'?'결과물 보여주는 해':dayE==='화'?'이름 알리기 좋은 해':dayE==='토'?'집·공부에 길':dayE==='금'?'승진·책임':dayE==='수'?'돈 버는 아이디어')+'<br>대운에서 '+yongsin+' 오는 10년이 대운!';
    document.getElementById('result').style.display='block';
    document.getElementById('result').scrollIntoView();
  }catch(e){document.getElementById('errorBox').textContent='오류:'+e.message;document.getElementById('errorBox').style.display='block'; alert('오류: '+e.message);}
}

// ===== 궁합 버튼 =====
function calcCouple(){
  try{
    var y1=parseInt(document.getElementById('c1_year').value), m1=parseInt(document.getElementById('c1_month').value), d1=parseInt(document.getElementById('c1_day').value);
    var y2=parseInt(document.getElementById('c2_year').value), m2=parseInt(document.getElementById('c2_month').value), d2=parseInt(document.getElementById('c2_day').value);
    var ys=parseInt(document.getElementById('s_year').value), ms=parseInt(document.getElementById('s_month').value), ds=parseInt(document.getElementById('s_day').value);
    var n1=document.getElementById('c1_name').value.trim()||'나', n2=document.getElementById('c2_name').value.trim()||'상대방', ns=document.getElementById('s_name').value.trim()||'시어머니';
    var p1=[getYearGanJi(y1), getMonthGanJi(getYearGanJi(y1).gan,m1), getDayGanJi(y1,m1,d1)];
    var p2=[getYearGanJi(y2), getMonthGanJi(getYearGanJi(y2).gan,m2), getDayGanJi(y2,m2,d2)];
    var ps=[getYearGanJi(ys), getMonthGanJi(getYearGanJi(ys).gan,ms), getDayGanJi(ys,ms,ds)];
    var ilgan1=p1[2].gan, ilgan2=p2[2].gan, ilganS=ps[2].gan;
    var e1=GAN_INFO[ilgan1].e, e2=GAN_INFO[ilgan2].e, es=GAN_INFO[ilganS].e;
    var sangsaeng={목:"화",화:"토",토:"금",금:"수",수:"목"}, sanggeuk={목:"토",화:"금",토:"수",금:"목",수:"화"};
    var score=60; if(sangsaeng[e1]===e2||sangsaeng[e2]===e1)score+=15; if(sanggeuk[e1]===e2||sanggeuk[e2]===e1)score-=10; if(e1===e2)score+=5;
    var hapPairs=[["子","丑"],["寅","亥"],["卯","戌"],["辰","酉"],["巳","申"],["午","未"]]; var chungPairs=[["子","午"],["丑","未"],["寅","申"],["卯","酉"],["辰","戌"],["巳","亥"]];
    var hapCnt=0,chungCnt=0; var jis1=[p1[0].ji,p1[1].ji,p1[2].ji], jis2=[p2[0].ji,p2[1].ji,p2[2].ji];
    for(var i=0;i<hapPairs.length;i++){var a=hapPairs[i][0],b=hapPairs[i][1]; if((jis1.indexOf(a)>=0&&jis2.indexOf(b)>=0)||(jis1.indexOf(b)>=0&&jis2.indexOf(a)>=0))hapCnt++;}
    for(var i=0;i<chungPairs.length;i++){var a=chungPairs[i][0],b=chungPairs[i][1]; if((jis1.indexOf(a)>=0&&jis2.indexOf(b)>=0)||(jis1.indexOf(b)>=0&&jis2.indexOf(a)>=0))chungCnt++;}
    score+=hapCnt*8; score-=chungCnt*6; score=Math.max(30,Math.min(98,score));
    document.getElementById('scoreRing').textContent=score+'점'; document.getElementById('scoreText').textContent=score>=80?'아주 잘 맞아요':score>=60?'보통':'노력 필요';
    document.getElementById('coupleNames').textContent=n1+'('+ilgan1+') ♥ '+n2+'('+ilgan2+')';
    document.getElementById('coupleDetail').innerHTML=n1+' '+ilgan1+'('+e1+') × '+n2+' '+ilgan2+'('+e2+') - '+(sangsaeng[e1]===e2?'상생으로 함께 성장':'상극이지만 서로 단련')+'<br>합 '+hapCnt+'개 충 '+chungCnt+'개';
    document.getElementById('marriageLife').innerHTML='결혼 생활: '+(score>=80?'배려 많아 금방 풀리는 집':'규칙 정해두면 좋음')+'<br>3년·7년 고비: '+(chungCnt>=2?'이사하면 충 풀림':'안정적')+'<br>2026~2028년 결혼 길';
    var counts1=getCounts(p1), counts2=getCounts(p2);
    var childStarE={목:"화",화:"토",토:"금",금:"수",수:"목"}[e1];
    var childTotal=(counts1[childStarE]||0)+(counts2[childStarE]||0);
    var childNum=childTotal>=4?'2~3명 가능':childTotal>=2?'1~2명':'1명에 집중';
    document.getElementById('childrenDetail').innerHTML='자녀별 '+childStarE+' '+childTotal+'개 → '+childNum+'<br>시기: '+(childTotal>=3?'30세 전후 첫째, 33세 전후 둘째':'결혼 2~3년 후');
    var sScore=60; if(sangsaeng[es]===e1||sangsaeng[e1]===es)sScore+=15; if(sanggeuk[es]===e1||sanggeuk[e1]===es)sScore-=12;
    var jisS=[ps[0].ji,ps[1].ji,ps[2].ji], sHap=0,sChung=0;
    for(var i=0;i<hapPairs.length;i++){var a=hapPairs[i][0],b=hapPairs[i][1]; if((jisS.indexOf(a)>=0&&jis1.indexOf(b)>=0)||(jisS.indexOf(b)>=0&&jis1.indexOf(a)>=0))sHap++;}
    for(var i=0;i<chungPairs.length;i++){var a=chungPairs[i][0],b=chungPairs[i][1]; if((jisS.indexOf(a)>=0&&jis1.indexOf(b)>=0)||(jisS.indexOf(b)>=0&&jis1.indexOf(a)>=0))sChung++;}
    sScore+=sHap*10; sScore-=sChung*8; sScore=Math.max(30,Math.min(95,sScore));
    document.getElementById('sidaeDetail').innerHTML=ns+'('+ilganS+' '+es+') vs '+n1+' - '+sScore+'점<br>합 '+sHap+' 충 '+sChung+' - '+(sScore>=75?'시어머니가 예뻐하는 궁합':'거리두기가 답');
    document.getElementById('coupleResult').style.display='block';
    document.getElementById('coupleResult').scrollIntoView();
  }catch(e){alert('궁합 오류: '+e.message);}
}
