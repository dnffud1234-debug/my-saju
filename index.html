<script>

var GAN=["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"];
var JI=["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
function getGanE(g){
  if(g=="甲"||g=="乙") return "목";
  if(g=="丙"||g=="丁") return "화";
  if(g=="戊"||g=="己") return "토";
  if(g=="庚"||g=="辛") return "금";
  if(g=="壬"||g=="癸") return "수";
  return "";
}
function getJiE(j){
  if(j=="寅"||j=="卯") return "목";
  if(j=="巳"||j=="午") return "화";
  if(j=="辰"||j=="戌"||j=="丑"||j=="未") return "토";
  if(j=="申"||j=="酉") return "금";
  if(j=="亥"||j=="子") return "수";
  return "";
}
function mod(n,m){return ((n % m) + m) % m;}
function getCycle(c){c=mod(c,60);return {"gan":GAN[c%10],"ji":JI[c%12]};}
function getYearGJ(y){return getCycle(y-4);}
function getMonthGJ(yg,mo){
  var map={"1":"寅","2":"卯","3":"辰","4":"巳","5":"午","6":"未","7":"申","8":"酉","9":"戌","10":"亥","11":"子","12":"丑"};
  var f=2;
  if(yg=="甲"||yg=="己") f=2;
  else if(yg=="乙"||yg=="庚") f=4;
  else if(yg=="丙"||yg=="辛") f=6;
  else if(yg=="丁"||yg=="壬") f=8;
  else if(yg=="戊"||yg=="癸") f=0;
  return {"gan":GAN[mod(f+mo-1,10)],"ji":map[mo+""]};
}
function getDayGJ(y,m,d){
  var b=new Date(1900,0,1);
  var c=new Date(y,m-1,d);
  var diff=Math.floor((c-b)/86400000);
  return getCycle(diff+10);
}
function getGanDesc(g){
  if(g=="甲") return "곧은 나무처럼 원칙과 정의가 강하고 리더십이 있습니다. 곧고 강직하며 봄에 태어나면 더욱 곧습니다.";
  if(g=="乙") return "꽃과 풀처럼 섬세하고 예술적이며 적응력이 뛰어납니다. 바람에 휘어지지만 꺾이지 않는 유연함이 있습니다.";
  if(g=="丙") return "태양처럼 밝고 열정이 넘치며 표현력이 뛰어납니다. 사람들에게 빛과 에너지를 주는 존재입니다.";
  if(g=="丁") return "촛불처럼 따뜻하고 배려심이 깊으며 섬세합니다. 작은 불이지만 오래가고 주변을 따뜻하게 합니다.";
  if(g=="戊") return "큰 산처럼 믿음직하고 안정적이며 책임감이 강합니다. 듬직하고 신뢰를 주는 타입입니다.";
  if(g=="己") return "논밭처럼 포용력이 넓고 실속 있으며 배려심이 깊습니다. 만물을 키우는 어머니 같은 땅입니다.";
  if(g=="庚") return "큰 바위와 칼처럼 결단력이 있고 의리가 강하며 추진력이 뛰어납니다. 단호하고 결단력 있는 타입입니다.";
  if(g=="辛") return "보석처럼 예민하고 완벽을 추구하며 관리 능력이 뛰어납니다. 섬세하고 깔끔하며 미적 감각이 뛰어납니다.";
  if(g=="壬") return "큰 바다처럼 지혜롭고 자유로우며 포용력이 넓습니다. 넓고 깊은 사고를 하는 타입입니다.";
  if(g=="癸") return "빗물과 이슬처럼 총명하고 섬세하며 직감이 뛰어납니다. 맑고 총명하며 통찰력이 있습니다.";
  return "";
}
function calcMy(){
  try{
    var y=parseInt(document.getElementById("year").value);
    var mo=parseInt(document.getElementById("month").value);
    var d=parseInt(document.getElementById("day").value);
    var h=parseInt(document.getElementById("hour").value);
    var name=document.getElementById("my_name").value||"고객님";
    var gender=document.querySelector('input[name="gender"]:checked').value;
    var lunar=document.querySelector('input[name="lunar"]:checked').value;
    var yGJ=getYearGJ(y);
    var mGJ=getMonthGJ(yGJ["gan"],mo);
    var dGJ=getDayGJ(y,mo,d);
    var idx=Math.floor((h+1)/2)%12;
    var f=0;
    if(dGJ["gan"]=="甲"||dGJ["gan"]=="己") f=0;
    else if(dGJ["gan"]=="乙"||dGJ["gan"]=="庚") f=2;
    else if(dGJ["gan"]=="丙"||dGJ["gan"]=="辛") f=4;
    else if(dGJ["gan"]=="丁"||dGJ["gan"]=="壬") f=6;
    else if(dGJ["gan"]=="戊"||dGJ["gan"]=="癸") f=8;
    var tGJ={"gan":GAN[mod(f+idx,10)],"ji":JI[idx]};
    var pillars=[yGJ["gan"]+yGJ["ji"], mGJ["gan"]+mGJ["ji"], dGJ["gan"]+dGJ["ji"], tGJ["gan"]+tGJ["ji"]];
    var dayE=getGanE(dGJ["gan"]);
    var counts={"목":0,"화":0,"토":0,"금":0,"수":0};
    var all=[yGJ,mGJ,dGJ,tGJ];
    for(var i=0;i<all.length;i++){
      var e1=getGanE(all[i]["gan"]);
      var e2=getJiE(all[i]["ji"]);
      if(e1) counts[e1]++;
      if(e2) counts[e2]++;
    }
    var sinGang=counts[dayE]>=3?"신강":"신약";
    var yongsin="";
    if(sinGang=="신강"){
      if(dayE=="목") yongsin="금";
      else if(dayE=="화") yongsin="토";
      else if(dayE=="토") yongsin="수";
      else if(dayE=="금") yongsin="화";
      else if(dayE=="수") yongsin="목";
    } else {
      if(dayE=="목") yongsin="수";
