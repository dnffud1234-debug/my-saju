*{box-sizing:border-box}body{margin:0;font-family:'Noto Sans KR',Arial,sans-serif;background:#fdf8f0;color:#111}

<div style="padding:10px;background:#fffbf5;border-radius:12px"><div style="font-size:11px;color:#888">건강운</div><div id="todayHealth" style="font-weight:800"></div><div id="todayHealthDesc" style="font-size:12px;margin-top:4px"></div></div>
</div></div>

<script>
const GAN=["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"], JI=["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
const GAN_INFO={甲:{e:"목"},乙:{e:"목"},丙:{e:"화"},丁:{e:"화"},戊:{e:"토"},己:{e:"토"},庚:{e:"금"},辛:{e:"금"},壬:{e:"수"},癸:{e:"수"}};
const JI_INFO={子:{e:"수"},丑:{e:"토"},寅:{e:"목"},卯:{e:"목"},辰:{e:"토"},巳:{e:"화"},午:{e:"화"},未:{e:"토"},申:{e:"금"},酉:{e:"금"},戌:{e:"토"},亥:{e:"수"}};
const JI_MONTH_MAP={1:"寅",2:"卯",3:"辰",4:"巳",5:"午",6:"未",7:"申",8:"酉",9:"戌",10:"亥",11:"子",12:"丑"};
function mod(n,m){return ((n%m)+m)%m}
function getCycle(c){c=mod(c,60);return{gan:GAN[c%10],ji:JI[c%12],cycle:c}}
function getYearGanJi(y){return getCycle(y-4)}
function getMonthGanJi(yg,mo){let f=2; if(yg==="甲"||yg==="己")f=2; else if(yg==="乙"||yg==="庚")f=4; else if(yg==="丙"||yg==="辛")f=6; else if(yg==="丁"||yg==="壬")f=8; else if(yg==="戊"||yg==="癸")f=0; return {gan:GAN[mod(f+mo-1,10)], ji:JI_MONTH_MAP[mo]}}
function getDayGanJi(y,m,d){try{const b=new Date(1900,0,1),c=new Date(y,m-1,d);return getCycle(Math.floor((c-b)/86400000)+10);}catch{return getCycle(y+m+d)}}
function getMaxDay(y,m){return new Date(y,m,0).getDate()}

function fillYearMonthDay(yId,mId,dId, defY){
  const yS=document.getElementById(yId), mS=document.getElementById(mId), dS=document.getElementById(dId);
  for(let y=1920;y<=2035;y++){let o=document.createElement('option');o.value=y;o.textContent=y+'년';if(y===defY)o.selected=true;yS.appendChild(o);}
  for(let m=1;m<=12;m++){let o=document.createElement('option');o.value=m;o.textContent=m+'월';if(m===5)o.selected=true;mS.appendChild(o);}
  function render(){let y=+yS.value,m=+mS.value,max=getMaxDay(y,m),prev=+dS.value||14,cur=Math.min(prev,max); dS.innerHTML=''; for(let d=1;d<=max;d++){let o=document.createElement('option');o.value=d;o.textContent=d+'일';if(d===cur)o.selected=true;dS.appendChild(o);} }
  yS.addEventListener('change',render); mS.addEventListener('change',render); render();
  return {yS,mS,dS,render};
}
const mainDates=fillYearMonthDay('year','month','day',1995);
const c1Dates=fillYearMonthDay('c1_year','c1_month','c1_day',1995);
const c2Dates=fillYearMonthDay('c2_year','c2_month','c2_day',1997);
const tDates=fillYearMonthDay('t_year','t_month','t_day',1995);

const hourSel=document.getElementById('hour'), minuteSel=document.getElementById('minute');
for(let h=0;h<24;h++){let o=document.createElement('option');o.value=h;o.textContent=h+'시';if(h===10)o.selected=true;hourSel.appendChild(o);}
for(let mi=0;mi<60;mi+=10){let o=document.createElement('option');o.value=mi;o.textContent=mi+'분';if(mi===30)o.selected=true;minuteSel.appendChild(o);}

// tabs
document.querySelectorAll('.tab').forEach(btn=>{btn.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active')); btn.classList.add('active');
  document.querySelectorAll('.tab-panel').forEach(p=>p.style.display='none');
  document.getElementById('tab-'+btn.dataset.tab).style.display='block';
})});

// my saju calc (simplified rich)
let lastIlgan=null, lastPillars=null;
document.getElementById('calcBtn').addEventListener('click',()=>{
  try{
    let y=+document.getElementById('year').value, mo=+document.getElementById('month').value, d=+document.getElementById('day').value, h=+hourSel.value, timeUnknown=document.getElementById('timeUnknown').checked, gender=document.querySelector('input[name=gender]:checked').value;
    let test=new Date(y,mo-1,d); if(test.getFullYear()!==y||test.getMonth()!==mo-1||test.getDate()!==d){document.getElementById('errorBox').textContent='존재하지 않는 날짜';document.getElementById('errorBox').style.display='block';return;} document.getElementById('errorBox').style.display='none';
    let yGJ=getYearGanJi(y), mGJ=getMonthGanJi(yGJ.gan,mo), dGJ=getDayGanJi(y,mo,d), tGJ=timeUnknown?{gan:"-",ji:"-"}:(()=>{let idx=h===23||h===0?0:Math.floor((h+1)/2)%12; let f=0; if(dGJ.gan==="甲"||dGJ.gan==="己")f=0; else if(dGJ.gan==="乙"||dGJ.gan==="庚")f=2; else if(dGJ.gan==="丙"||dGJ.gan==="辛")f=4; else if(dGJ.gan==="丁"||dGJ.gan==="壬")f=6; else if(dGJ.gan==="戊"||dGJ.gan==="癸")f=8; return {gan:GAN[mod(f+idx,10)], ji:JI[idx]}})();
    let pillars=[{label:"년주",...yGJ},{label:"월주",...mGJ},{label:"일주",...dGJ,master:true},{label:"시주",...tGJ}];
    lastIlgan=dGJ.gan; lastPillars=pillars;
    document.getElementById('pillars').innerHTML=pillars.map(p=>'<div class="pillar'+(p.master?' pillar-master':'')+'"><div style="font-size:10px">'+p.label+'</div><div style="font-weight:900">'+p.gan+'</div><div style="font-weight:900">'+p.ji+'</div></div>').join('');
    document.getElementById('metaText').textContent=y+'년 '+mo+'월 '+d+'일 '+gender+' '+pillars.map(p=>p.gan+p.ji).join(' ');
    let counts={목:0,화:0,토:0,금:0,수:0}; pillars.forEach(p=>{if(p.label==="시주"&&timeUnknown)return; if(p.gan!=="-"){let e=GAN_INFO[p.gan]?.e; if(e)counts[e]++} if(p.ji!=="-"){let e=JI_INFO[p.ji]?.e; if(e)counts[e]++}});
    document.getElementById('oheng').innerHTML=Object.entries(counts).map(([k,v])=>'<span style="padding:6px 10px;background:#eee;border-radius:999px;font-size:12px">'+k+' '+v+'개</span>').join(' ');
    document.getElementById('yongsin').textContent='일간 '+lastIlgan+'('+GAN_INFO[lastIlgan].e+') - 가장 많은 오행: '+Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][0];
    document.getElementById('detailText').innerHTML=lastIlgan+'일간은 '+(GAN_INFO[lastIlgan].e+' 기운으로 곧고 정직해요. ').repeat(3)+'<br><br>재물·직업·애정·건강 상세는 일간 중심으로 풀이됩니다. (v7.0 상세 로직)';
    document.getElementById('aiFinal').innerHTML=lastIlgan+'일간 '+y+'년생 '+gender+' - 2026년은 화 기운이 강한 해로 도전과 표현에 좋아요. 균형을 맞춰가세요.';
    document.getElementById('result').style.display='block';
  }catch(e){document.getElementById('errorBox').textContent='오류:'+e.message;document.getElementById('errorBox').style.display='block';}
});

// couple calc
document.getElementById('coupleBtn').addEventListener('click',()=>{
  let y1=+document.getElementById('c1_year').value, m1=+document.getElementById('c1_month').value, d1=+document.getElementById('c1_day').value;
  let y2=+document.getElementById('c2_year').value, m2=+document.getElementById('c2_month').value, d2=+document.getElementById('c2_day').value;
  let g1=document.querySelector('input[name=c1_gender]:checked').value, g2=document.querySelector('input[name=c2_gender]:checked').value;
  let p1=[getYearGanJi(y1), getMonthGanJi(getYearGanJi(y1).gan,m1), getDayGanJi(y1,m1,d1)];
  let p2=[getYearGanJi(y2), getMonthGanJi(getYearGanJi(y2).gan,m2), getDayGanJi(y2,m2,d2)];
  let ilgan1=p1[2].gan, ilgan2=p2[2].gan;
  let e1=GAN_INFO[ilgan1].e, e2=GAN_INFO[ilgan2].e;

  // compatibility score
  const sangsaeng={목:{생:"화",극:"토"}, 화:{생:"토",극:"금"}, 토:{생:"금",극:"수"}, 금:{생:"수",극:"목"}, 수:{생:"목",극:"화"}};
  let score=60;
  if(sangsaeng[e1].생===e2 || sangsaeng[e2].생===e1) score+=15; // 상생
  if(sangsaeng[e1].극===e2 || sangsaeng[e2].극===e1) score-=10; // 상극
  if(e1===e2) score+=5; // 같은 오행은 동질감

  // gan hap
  const cheonganHap={甲:"己",己:"甲",乙:"庚",庚:"乙",丙:"辛",辛:"丙",丁:"壬",壬:"丁",戊:"癸",癸:"戊"};
  if(cheonganHap[ilgan1]===ilgan2) score+=10;

  // ji hap/chung
  const hapPairs=[["子","丑"],["寅","亥"],["卯","戌"],["辰","酉"],["巳","申"],["午","未"]];
  const chungPairs=[["子","午"],["丑","未"],["寅","申"],["卯","酉"],["辰","戌"],["巳","亥"]];
  let hapCnt=0, chungCnt=0;
  let jis1=p1.map(p=>p.ji), jis2=p2.map(p=>p.ji);
  hapPairs.forEach(([a,b])=>{if((jis1.includes(a)&&jis2.includes(b))||(jis1.includes(b)&&jis2.includes(a))) hapCnt++});
  chungPairs.forEach(([a,b])=>{if((jis1.includes(a)&&jis2.includes(b))||(jis1.includes(b)&&jis2.includes(a))) chungCnt++});
  score+=hapCnt*8; score-=chungCnt*6;
  score=Math.max(30, Math.min(98, score));

  const ring=document.getElementById('scoreRing');
  ring.textContent=score+'점';
  ring.style.background='conic-gradient(#8b5a2b '+score+'%, #ffe0b2 '+score+'% 100%)';
  ring.style.color=score>=80?'#fff':'#111';
  ring.style.backgroundColor=score>=80?'#8b5a2b':'#ffe0b2';

  let level=score>=90?'천생연분!':score>=80?'아주 잘 맞아요':score>=70?'잘 맞아요':score>=60?'보통, 노력하면 좋아요':score>=50?'노력이 필요해요':'부딪힘이 있어요';
  document.getElementById('scoreText').textContent=level+' ('+e1+' '+e1+' 일간 '+ilgan1+' & '+e2+' 일간 '+ilgan2+')';
  document.getElementById('coupleGanji').textContent='나: '+p1.map(p=>p.gan+p.ji).join(' ')+' / 상대: '+p2.map(p=>p.gan+p.ji).join(' ');

  document.getElementById('coupleDetail').innerHTML='<b>일간 궁합:</b> '+ilgan1+'('+e1+')와 '+ilgan2+'('+e2+')는 '+(sangsaeng[e1].생===e2?'서로 생해주는 상생 관계예요. 함께 있으면 성장해요.':sangsaeng[e1].극===e2?'서로 극하는 관계라 부딪힘이 있지만, 서로를 단련시켜 성장시켜요.':'같은 오행으로 동질감이 강해요. 서로를 잘 이해해요.')+'<br><br><b>천간합:</b> '+(cheonganHap[ilgan1]===ilgan2?'일간이 천간합! 인연이 깊어요. 떨어져 있어도 끌리는 사이.':'천간합은 없지만 지지로 볼 수 있어요.')+'<br><br><b>성격 궁합:</b> '+(g1!==g2?'음양이 조화로워 균형이 맞아요.':'같은 성향이라 공감은 잘 되지만, 양보가 필요해요.');

  document.getElementById('coupleOheng').innerHTML='합 '+hapCnt+'개, 충 '+chungCnt+'개<br>합이 많으면 인연·결속이 강하고, 충이 많으면 변화·이동이 많아요. 충은 나쁜 게 아니라 두 사람이 함께 새로운 곳으로 가게 만드는 힘이에요.';
  document.getElementById('coupleHap').innerHTML='지지 합: '+hapCnt+'개, 지지 충: '+chungCnt+'개<br>'+(hapCnt>chungCnt?'합이 더 많아 안정적인 궁합':'충이 있어 다이나믹한 궁합, 함께 여행·이사·새로운 도전하면 좋아요');
  document.getElementById('coupleTip').innerHTML=(score>=80?'이미 잘 맞아요. 서로의 다른 점을 인정하고 칭찬을 많이 해주세요.':score>=60?'소통이 핵심! '+e1+'는 '+(e1==='목'?'고집을 조금 내려놓고':'')+(e1==='화'?'감정 표현을 조금 조절하고':'')+' '+e2+'는 '+(e2==='금'?'기준을 조금 낮추고':'')+' 배려하면 80점 이상으로 올라가요.':'부딪힘이 있지만, 이게 서로를 성장시키는 약이에요. 일주일에 한 번은 서로의 언어로 대화하는 시간을 가져보세요. (예: 목일간은 행동으로, 화일간은 말로)');

  document.getElementById('coupleResult').style.display='block';
});

// today fortune
const today=new Date();
document.getElementById('todayDateText').textContent=today.getFullYear()+'년 '+(today.getMonth()+1)+'월 '+today.getDate()+'일';
const todayGJ=getDayGanJi(today.getFullYear(), today.getMonth()+1, today.getDate());
document.getElementById('todayGanjiText').textContent=todayGJ.gan+todayGJ.ji+'일';

document.getElementById('todayBtn').addEventListener('click',()=>{
  let y=+document.getElementById('t_year').value, mo=+document.getElementById('t_month').value, d=+document.getElementById('t_day').value;
  let myDay=getDayGanJi(y,mo,d).gan;
  if(!myDay){alert('내 생일을 먼저 선택해주세요');return;}
  let tGan=todayGJ.gan, tJi=todayGJ.ji;
  let myE=GAN_INFO[myDay].e, tE=GAN_INFO[tGan].e, tJiE=JI_INFO[tJi].e;

  // simple fortune calc based on relation
  const sangsaeng={목:"화",화:"토",토:"금",금:"수",수:"목"};
  const sanggeuk={목:"토",화:"금",토:"수",금:"목",수:"화"};

  let totalScore=60;
  if(sangsaeng[myE]===tE) totalScore+=15;
  if(sanggeuk[myE]===tE) totalScore-=10;
  if(myE===tE) totalScore+=5;
  if(myE===tJiE) totalScore+=5;

  totalScore+= (today.getDate()%10)*2; // daily variation
  totalScore=Math.max(40, Math.min(95, totalScore));

  const money = totalScore>75?'💰 좋음 '+ (totalScore-10)+'점' : totalScore>60?'보통 '+totalScore+'점' : '주의 '+totalScore+'점';
  const love = totalScore>70?'💕 좋음' : totalScore>55?'보통' : '다툼 주의';
  const work = totalScore>75?'🔥 좋음' : totalScore>60?'보통' : '무리하지 말기';
  const health = myE===tJiE?'보통, 무리 금지' : '좋음, 컨디션 양호';

  document.getElementById('todayTotal').innerHTML='오늘은 <b>'+tGan+tJi+'일('+tE+','+tJiE+')</b>이에요. '+myDay+'('+myE+') 일간인 당신에게는 '+(sangsaeng[myE]===tE?'기운을 북돋아주는 날, 표현하고 보여주면 좋은 날!':sanggeuk[myE]===tE?'조금 부딪히는 날, 중요한 결정은 내일로 미루고 오늘은 정리하는 날로.':'균형 잡힌 날, 평소처럼 꾸준히 가면 좋은 결과가 따라와요.')+'<br><br>총운 점수: <b>'+totalScore+'점</b> / '+(totalScore>=80?'대길!':'')+(totalScore>=60&&totalScore<80?'중길':'')+(totalScore<60?'소길, 조심':'');
  document.getElementById('todayMoney').textContent=money;
  document.getElementById('todayMoneyDesc').textContent= totalScore>75?'작은 투자, 쇼핑, 계약에 좋은 날' : '지출을 줄이고 저축에 집중';
  document.getElementById('todayLove').textContent=love;
  document.getElementById('todayLoveDesc').textContent= love.includes('좋음')?'고백, 데이트, 연락하기 좋은 날' : '말을 아끼고 들어주는 날';
  document.getElementById('todayWork').textContent=work;
  document.getElementById('todayWorkDesc').textContent= work.includes('좋음')?'발표, 제안, 미팅에 좋은 날' : '문서 정리, 공부, 계획 세우기';
  document.getElementById('todayHealth').textContent=health;
  document.getElementById('todayHealthDesc').textContent= tJiE==='화'?'물 많이 마시기' : tJiE==='수'?'따뜻하게 입기' : '가벼운 산책 추천';
  document.getElementById('todayAdvice').innerHTML='오늘 일진 '+tGan+tJi+'는 '+tJiE+' 기운이 강해요. '+myDay+'일간인 당신은 '+(myE==='목'?'<b>초록색 옷, 동쪽 산책</b>이 행운을 가져와요.':'')+(myE==='화'?'<b>빨간 소품, 남쪽 카페</b>에서 아이디어가 떠올라요.':'')+(myE==='토'?'<b>노란 메모, 정리정돈</b>으로 재물운이 올라가요.':'')+(myE==='금'?'<b>하얀 셔츠, 깔끔한 정리</b>가 오늘의 포인트.':'')+(myE==='수'?'<b>검정·파랑, 물 근처</b>에서 영감이 와요.':'')+'<br><br>💡 오늘의 한마디: '+(totalScore>=80?'오늘은 밀어붙이는 날! 망설이지 말고 GO!':totalScore>=60?'꾸준함이 답인 날, 작은 것부터 하나씩.':'쉬어가는 날, 내일을 위해 에너지를 모아두세요.');

  document.getElementById('todayResult').style.display='block';
});
</script>
