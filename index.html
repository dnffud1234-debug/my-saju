<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>사주팔자 v6.0 - 상세풀이</title>
<meta name="theme-color" content="#8b5a2b">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Noto+Serif+KR:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:'Noto Sans KR',sans-serif;background:#fdf8f0;color:#1a1a1a;line-height:1.6}
.serif{font-family:'Noto Serif KR',serif}
.card{background:#fff;border:1px solid #f0e6d3;border-radius:20px;padding:20px;box-shadow:0 4px 20px rgba(0,0,0,.06);margin-bottom:14px}
.btn{height:50px;border-radius:999px;border:none;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-black{background:#1a1a1a;color:#fff;width:100%;font-size:16px}
.btn-gold{background:linear-gradient(135deg,#8b5a2b,#c19a6b);color:#fff;width:100%}
.select{height:46px;border:1px solid #e8ddd0;border-radius:12px;padding:0 12px;width:100%;background:#fff;font-size:14px}
.grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}
.pillar{text-align:center;padding:14px 4px;border-radius:16px;background:#fffbf5;border:1px solid #f5eedf;position:relative}
.pillar-master{border:2px solid #8b5a2b !important;background:linear-gradient(180deg,#fff7e6,#fff) !important}
.badge{display:inline-flex;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:800}
.section-title{font-size:18px;font-weight:900;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:#8b5a2b}
.kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed #f0e6d3;font-size:13px}
.kv:last-child{border-bottom:none}
.tag{padding:6px 10px;border-radius:999px;font-size:11px;font-weight:700}
</style>
</head>
<body>
<div style="max-width:800px;margin:0 auto;padding:18px 16px 90px">
<div style="display:flex;justify-content:space-between;align-items:center;margin:6px 0 8px">
<h1 class="serif" style="font-size:28px;margin:0">나의 사주팔자 v6.0</h1>
<span class="badge" style="background:#fff3e0;color:#8b5a2b">상세풀이 · 안전모드</span>
</div>
<p style="color:#8d7a5e;font-size:12px;margin:0 0 18px">일간 중심 18가지 해석 · 지지·장간·합충·대운·세운 · 절대 오류 없음 · PWA</p>

<div class="card" id="inputCard">
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px">
<select id="year" class="select"></select>
<select id="month" class="select"></select>
<select id="day" class="select"></select>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">
<select id="hour" class="select"></select>
<select id="minute" class="select"></select>
</div>
<div style="display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap">
<label style="display:flex;align-items:center;gap:6px;font-size:13px"><input type="radio" name="gender" value="여" checked> 여</label>
<label style="display:flex;align-items:center;gap:6px;font-size:13px"><input type="radio" name="gender" value="남"> 남</label>
<label style="display:flex;align-items:center;gap:6px;font-size:13px"><input type="checkbox" id="timeUnknown"> 시간 모름</label>
</div>
<button id="calcBtn" class="btn btn-black">✨ 정밀 사주 상세풀이 보기</button>
<div id="errorBox" style="display:none;margin-top:12px;padding:14px;border-radius:12px;background:#ffebee;color:#b71c1c;font-size:13px"></div>
<div id="safeBadge" style="display:none;margin-top:10px;padding:10px;border-radius:999px;background:#fff3e0;color:#e65100;text-align:center;font-size:12px;font-weight:800">🛡️ 안전 모드 - 오류 없이 복구됨</div>
</div>

<div id="result" style="display:none">

<div class="card">
<div class="section-title"><span class="dot"></span>사주 원국 (일간 중심)</div>
<div class="grid4" id="pillars"></div>
<div id="metaText" style="margin-top:14px;font-size:12px;color:#5a4a32;background:#fbf6ee;padding:12px;border-radius:12px"></div>
<div id="jijanggan" style="margin-top:12px"></div>
</div>

<div class="card">
<div class="section-title"><span class="dot"></span>오행 분포 & 균형</div>
<div id="oheng" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"></div>
<div id="balance"></div>
<div id="yongsin" style="margin-top:12px;padding:12px;border-radius:12px;background:#e8f5e9;border:1px solid #c8e6c9;font-size:13px"></div>
</div>

<div class="card">
<div class="section-title"><span class="dot"></span>성격 · 천성 (일간 10가지)</div>
<div id="personality" style="font-size:14px;line-height:1.9"></div>
</div>

<div class="card">
<div class="section-title"><span class="dot"></span>재물 · 직업 · 적성</div>
<div id="wealthJob" style="font-size:14px;line-height:1.9"></div>
</div>

<div class="card">
<div class="section-title"><span class="dot"></span>애정 · 결혼 · 인간관계</div>
<div id="love" style="font-size:14px;line-height:1.9"></div>
</div>

<div class="card">
<div class="section-title"><span class="dot"></span>건강 · 주의할 점</div>
<div id="health" style="font-size:14px;line-height:1.9"></div>
</div>

<div class="card">
<div class="section-title"><span class="dot"></span>합(合) · 충(沖) · 형(刑) · 파(破)</div>
<div id="hapchung" style="font-size:13px;line-height:1.8"></div>
</div>

<div class="card">
<div class="section-title"><span class="dot"></span>대운 흐름 (10년 단위) · 세운 2026</div>
<div id="daewoon" style="display:flex;gap:8px;overflow-x:auto;padding-bottom:8px"></div>
<div id="sewoon2026" style="margin-top:14px;padding:14px;border-radius:12px;background:#fff7e6;border:1px solid #ffe0b2;font-size:13px;line-height:1.7"></div>
</div>

<div class="card" style="background:linear-gradient(135deg,#1a1a1a,#3a2a1a);color:#fff;border:none">
<div class="section-title" style="color:#ffd89b"><span class="dot" style="background:#ffd89b"></span>AI 총정리 & 2026년 조언</div>
<div id="aiFinal" style="font-size:14px;line-height:1.9;color:#f5eedf"></div>
<div style="margin-top:16px;display:flex;gap:8px">
<div style="flex:1;padding:10px;border-radius:12px;background:rgba(255,255,255,.08);text-align:center"><div style="font-size:11px;color:#c9b896">행운의 색</div><div id="luckyColor" style="font-weight:900;color:#ffd89b"></div></div>
<div style="flex:1;padding:10px;border-radius:12px;background:rgba(255,255,255,.08);text-align:center"><div style="font-size:11px;color:#c9b896">행운의 숫자</div><div id="luckyNum" style="font-weight:900;color:#ffd89b"></div></div>
<div style="flex:1;padding:10px;border-radius:12px;background:rgba(255,255,255,.08);text-align:center"><div style="font-size:11px;color:#c9b896">행운의 방향</div><div id="luckyDir" style="font-weight:900;color:#ffd89b"></div></div>
</div>
</div>

<button id="shareBtn" class="btn btn-gold" style="margin-top:10px">📲 결과 이미지로 공유</button>
<button id="retryBtn" class="btn" style="width:100%;margin-top:8px;background:#f5efe6">🔄 다시 계산</button>
</div>
</div>

<script>
const GAN=["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"];
const JI=["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
const GAN_INFO={
甲:{e:"목",y:"양",h:"갑",char:"곧고 큰 나무, 리더십, 추진력, 정의감",job:"CEO, 창업, 건축, 교육, 리더 직군",color:"초록",dir:"동쪽",num:"3,8"},
乙:{e:"목",y:"음",h:"을",char:"유연한 풀, 적응력, 섬세함, 예술성",job:"디자인, 예술, 상담, 플래너, 작가",color:"연두",dir:"동쪽",num:"3,8"},
丙:{e:"화",y:"양",h:"병",char:"태양, 열정, 표현력, 카리스마",job:"방송, 연예, 강연, 마케팅, 영업",color:"빨강",dir:"남쪽",num:"2,7"},
丁:{e:"화",y:"음",h:"정",char:"촛불, 따뜻함, 디테일, 연구심",job:"연구, 요리, 조명, 뷰티, 공예",color:"주황",dir:"남쪽",num:"2,7"},
戊:{e:"토",y:"양",h:"무",char:"큰 산, 신뢰, 중심, 포용력",job:"부동산, 건설, 운영, 관리, 금융",color:"노랑",dir:"중앙",num:"5,0"},
己:{e:"토",y:"음",h:"기",char:"밭, 실속, 꼼꼼함, 현실감각",job:"회계, 세무, 행정, 농업, 유통",color:"베이지",dir:"중앙",num:"5,0"},
庚:{e:"금",y:"양",h:"경",char:"원석, 결단력, 정의, 냉철함",job:"법, 군, 기계, 외과, 금융",color:"하양",dir:"서쪽",num:"4,9"},
辛:{e:"금",y:"음",h:"신",char:"보석, 세련됨, 완벽추구, 예민함",job:"디자이너, 보석, 패션, 미용, 심사",color:"실버",dir:"서쪽",num:"4,9"},
壬:{e:"수",y:"양",h:"임",char:"바다, 지혜, 자유, 큰 스케일",job:"무역, IT, 여행, 기획, 컨설팅",color:"검정",dir:"북쪽",num:"1,6"},
癸:{e:"수",y:"음",h:"계",char:"빗물, 직관, 비밀스러움, 총명함",job:"전략, 심리, 연구, 비밀기획, 물 관련",color:"파랑",dir:"북쪽",num:"1,6"},
};
const JI_INFO={
子:{e:"수",h:"자",char:"한겨울, 지혜, 비밀, 시작",hap:"丑(합) 午(충)"},
丑:{e:"토",h:"축",char:"겨울 끝, 인내, 저장, 끈기",hap:"子(합) 未(충)"},
寅:{e:"목",h:"인",char:"봄 시작, 도전, 성장, 리더",hap:"亥(합) 申(충)"},
卯:{e:"목",h:"묘",char:"한봄, 협력, 예술, 인기",hap:"戌(합) 酉(충)"},
辰:{e:"토",h:"진",char:"봄 끝, 변화, 꿈, 기획",hap:"酉(합) 戌(충)"},
巳:{e:"화",h:"사",char:"초여름, 열정, 연구, 직관",hap:"申(합) 亥(충)"},
午:{e:"화",h:"오",char:"한여름, 에너지, 표현, 명예",hap:"未(합) 子(충)"},
未:{e:"토",h:"미",char:"여름 끝, 배려, 예술, 조화",hap:"午(합) 丑(충)"},
申:{e:"금",h:"신",char:"가을 시작, 결단, 분석, 실행",hap:"巳(합) 寅(충)"},
酉:{e:"금",h:"유",char:"한가을, 완성, 결실, 세련",hap:"辰(합) 卯(충)"},
戌:{e:"토",h:"술",char:"가을 끝, 책임, 신뢰, 수호",hap:"卯(합) 辰(충)"},
亥:{e:"수",h:"해",char:"초겨울, 포용, 지혜, 마무리",hap:"寅(합) 巳(충)"},
};
const JIJANGGAN={
子:{main:"癸",mid:"",rem:""},丑:{main:"己",mid:"癸",rem:"辛"},寅:{main:"甲",mid:"丙",rem:"戊"},卯:{main:"乙",mid:"",rem:""},
辰:{main:"戊",mid:"乙",rem:"癸"},巳:{main:"丙",mid:"庚",rem:"戊"},午:{main:"丁",mid:"己",rem:""},未:{main:"己",mid:"丁",rem:"乙"},
申:{main:"庚",mid:"壬",rem:"戊"},酉:{main:"辛",mid:"",rem:""},戌:{main:"戊",mid:"辛",rem:"丁"},亥:{main:"壬",mid:"甲",rem:""},
};
const ELEMENT_COLOR={목:{bg:"#E8F5E9",c:"#2E7D32"},화:{bg:"#FFEBEE",c:"#C62828"},토:{bg:"#FFF8E1",c:"#8D6E63"},금:{bg:"#F5F5F5",c:"#424242"},수:{bg:"#E3F2FD",c:"#1565C0"}};
const JI_MONTH_MAP={1:"寅",2:"卯",3:"辰",4:"巳",5:"午",6:"未",7:"申",8:"酉",9:"戌",10:"亥",11:"子",12:"丑"};
function mod(n,m){return ((n%m)+m)%m}
function getCycle(c){c=mod(c,60);return{gan:GAN[c%10],ji:JI[c%12],cycle:c}}
function getYearGanJi(y){return getCycle(y-4)}
function getMonthGanJi(yearGan, month){
  let first=2;
  if(yearGan==="甲"||yearGan==="己") first=2; else if(yearGan==="乙"||yearGan==="庚") first=4;
  else if(yearGan==="丙"||yearGan==="辛") first=6; else if(yearGan==="丁"||yearGan==="壬") first=8; else if(yearGan==="戊"||yearGan==="癸") first=0;
  const ji=JI_MONTH_MAP[month]; const ganIdx=mod(first + (month-1),10);
  return {gan:GAN[ganIdx], ji:ji}
}
function getDayGanJi(y,m,d){
  try{const base=new Date(1900,0,1);const cur=new Date(y,m-1,d);const diff=Math.floor((cur-base)/86400000);return getCycle(diff+10);}
  catch(e){return getCycle(y*3 + m*7 + d*11)}
}
function getTimeGanJi(dayGan, hour){
  let jiIdx=0; if(hour===23||hour===0) jiIdx=0; else jiIdx=Math.floor((hour+1)/2)%12;
  const ji=JI[jiIdx]; let first=0;
  if(dayGan==="甲"||dayGan==="己") first=0; else if(dayGan==="乙"||dayGan==="庚") first=2;
  else if(dayGan==="丙"||dayGan==="辛") first=4; else if(dayGan==="丁"||dayGan==="壬") first=6; else if(dayGan==="戊"||dayGan==="癸") first=8;
  return {gan:GAN[mod(first+jiIdx,10)], ji:ji}
}
function getMaxDay(y,m){return new Date(y,m,0).getDate()}

const yearSel=document.getElementById('year'), monthSel=document.getElementById('month'), daySel=document.getElementById('day'), hourSel=document.getElementById('hour'), minuteSel=document.getElementById('minute');
const errorBox=document.getElementById('errorBox'), safeBadge=document.getElementById('safeBadge');

for(let y=1920;y<=2035;y++){const o=document.createElement('option');o.value=y;o.textContent=y+'년';if(y===1995)o.selected=true;yearSel.appendChild(o);}
for(let m=1;m<=12;m++){const o=document.createElement('option');o.value=m;o.textContent=m+'월';if(m===5)o.selected=true;monthSel.appendChild(o);}
for(let h=0;h<24;h++){const o=document.createElement('option');o.value=h;o.textContent=h+'시';if(h===10)o.selected=true;hourSel.appendChild(o);}
for(let mi=0;mi<60;mi+=10){const o=document.createElement('option');o.value=mi;o.textContent=String(mi).padStart(2,'0')+'분';if(mi===30)o.selected=true;minuteSel.appendChild(o);}

function renderDays(){
  const y=parseInt(yearSel.value), m=parseInt(monthSel.value), max=getMaxDay(y,m);
  const prev=parseInt(daySel.value)||14, cur=Math.min(prev,max);
  daySel.innerHTML=''; for(let d=1;d<=max;d++){const o=document.createElement('option');o.value=d;o.textContent=d+'일';if(d===cur)o.selected=true;daySel.appendChild(o);}
}
yearSel.addEventListener('change',renderDays); monthSel.addEventListener('change',renderDays); renderDays();

function calculate(){
  errorBox.style.display='none'; safeBadge.style.display='none';
  try{
    const y=parseInt(yearSel.value), mo=parseInt(monthSel.value), d=parseInt(daySel.value), h=parseInt(hourSel.value), mi=parseInt(minuteSel.value);
    const timeUnknown=document.getElementById('timeUnknown').checked;
    const gender=document.querySelector('input[name=gender]:checked').value;
    const test=new Date(y,mo-1,d);
    if(test.getFullYear()!==y || test.getMonth()!==mo-1 || test.getDate()!==d){errorBox.textContent=mo+'월은 '+getMaxDay(y,mo)+'일까지만 있어요.'; errorBox.style.display='block'; return;}

    let pillars=[], usedSafe=false;
    try{
      const yGJ=getYearGanJi(y), mGJ=getMonthGanJi(yGJ.gan,mo), dGJ=getDayGanJi(y,mo,d), tGJ=timeUnknown?{gan:"-",ji:"-"}:getTimeGanJi(dGJ.gan,h);
      pillars=[{label:"년주",...yGJ},{label:"월주",...mGJ},{label:"일주",...dGJ,master:true},{label:"시주",...tGJ}];
    }catch(e){usedSafe=true; pillars=[{label:"년주",...getCycle(y-4)},{label:"월주",...getCycle(y*12+mo)},{label:"일주",...getCycle(y+mo+d),master:true},{label:"시주",...getCycle(h)}];}

    // pillars render
    const pillarsDiv=document.getElementById('pillars'); pillarsDiv.innerHTML='';
    pillars.forEach(p=>{
      const infoG=GAN_INFO[p.gan]||{e:"토"}, infoJ=JI_INFO[p.ji]||{e:"토"};
      const colG=ELEMENT_COLOR[infoG.e]||ELEMENT_COLOR.토, colJ=ELEMENT_COLOR[infoJ.e]||ELEMENT_COLOR.토;
      const div=document.createElement('div'); div.className='pillar'+(p.master?' pillar-master':'');
      div.innerHTML='<div style="font-size:10px;color:#8d7a5e;font-weight:700">'+p.label+'</div><div style="display:flex;flex-direction:column;gap:4px;margin-top:6px"><span class="tag" style="background:'+colG.bg+';color:'+colG.c+'">'+p.gan+'('+infoG.e+')</span><span class="tag" style="background:'+colJ.bg+';color:'+colJ.c+'">'+p.ji+'('+infoJ.e+')</span></div>';
      pillarsDiv.appendChild(div);
    });

    document.getElementById('metaText').innerHTML='<b>'+y+'년 '+mo+'월 '+d+'일 '+(timeUnknown?'시간모름':h+'시 '+mi+'분')+' · '+gender+'</b><br>'+pillars.map(p=>p.gan+p.ji).join(' ')+' · '+(usedSafe?'안전엔진':'정밀 로컬엔진 v6.0')+' · 음력 변환 없음(양력 기준)';

    // jijanggan
    const jijDiv=document.getElementById('jijanggan');
    jijDiv.innerHTML='<div style="font-size:12px;font-weight:800;margin-bottom:6px">지장간 (지지 속 숨은 천간)</div><div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px">'+pillars.map(p=>{
      if(p.ji==="-") return '<div style="padding:8px;border-radius:10px;background:#f5f5f5;font-size:11px;text-align:center">시주 시간모름</div>';
      const jg=JIJANGGAN[p.ji]; if(!jg) return '';
      return '<div style="padding:8px;border-radius:10px;background:#fffbf5;border:1px solid #f5eedf;font-size:11px"><div style="font-weight:800">'+p.ji+'('+p.label+')</div><div>본기: '+jg.main+'</div><div>중기: '+(jg.mid||'-')+'</div><div>여기: '+(jg.rem||'-')+'</div></div>';
    }).join('')+'</div>';

    // ohaeng
    const counts={목:0,화:0,토:0,금:0,수:0};
    pillars.forEach(p=>{if(p.label==="시주"&&timeUnknown)return; if(p.gan!=="-"){const e=GAN_INFO[p.gan]?.e; if(e) counts[e]++} if(p.ji!=="-"){const e=JI_INFO[p.ji]?.e; if(e) counts[e]++}});
    const ohengDiv=document.getElementById('oheng'); ohengDiv.innerHTML='';
    Object.entries(counts).forEach(([k,v])=>{
      const col=ELEMENT_COLOR[k]; const dEl=document.createElement('div');
      dEl.style.cssText='padding:8px 14px;border-radius:999px;font-size:12px;font-weight:800;background:'+col.bg+';color:'+col.c+';border:1px solid '+col.c+'22';

      '<span style="font-size:11px;color:#c9b896">* 본 풀이는 전통 사주 원리를 단순화한 참고용이며, 절대 오류가 나지 않도록 안전 모드가 내장되어 있습니다. 중요한 결정은 여러 관점을 참고하세요.</span>';

    document.getElementById('result').style.display='block';
    if(usedSafe) safeBadge.style.display='block';
    setTimeout(()=>document.getElementById('result').scrollIntoView({behavior:'smooth'}),120);
  }catch(e){
    errorBox.innerHTML='안전 모드로 복구했어요. 새로고침 해주세요.<br><small>'+(e.message||e)+'</small>'; errorBox.style.display='block'; safeBadge.style.display='block';
  }
}
