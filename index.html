<script>

function showTab(name){
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p=>p.style.display='none');
  var btn = document.querySelector('[data-tab='+name+']');
  if(btn) btn.classList.add('active');
  var panel = document.getElementById('tab-'+name);
  if(panel) panel.style.display='block';

const GAN=["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"], JI=["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
const GAN_INFO={甲:{e:"목",h:"갑"},乙:{e:"목",h:"을"},丙:{e:"화",h:"병"},丁:{e:"화",h:"정"},戊:{e:"토",h:"무"},己:{e:"토",h:"기"},庚:{e:"금",h:"경"},辛:{e:"금",h:"신"},壬:{e:"수",h:"임"},癸:{e:"수",h:"계"}};
const JI_INFO={子:{e:"수"},丑:{e:"토"},寅:{e:"목"},卯:{e:"목"},辰:{e:"토"},巳:{e:"화"},午:{e:"화"},未:{e:"토"},申:{e:"금"},酉:{e:"금"},戌:{e:"토"},亥:{e:"수"}};
const JI_MONTH_MAP={1:"寅",2:"卯",3:"辰",4:"巳",5:"午",6:"未",7:"申",8:"酉",9:"戌",10:"亥",11:"子",12:"丑"};
function mod(n,m){return ((n%m)+m)%m}
function getCycle(c){c=mod(c,60);return{gan:GAN[c%10],ji:JI[c%12],cycle:c}}
function getYearGanJi(y){return getCycle(y-4)}
function getMonthGanJi(yg,mo){let f=2; if(yg==="甲"||yg==="己")f=2; else if(yg==="乙"||yg==="庚")f=4; else if(yg==="丙"||yg==="辛")f=6; else if(yg==="丁"||yg==="壬")f=8; else if(yg==="戊"||yg==="癸")f=0; return {gan:GAN[mod(f+mo-1,10)], ji:JI_MONTH_MAP[mo]}}
function getDayGanJi(y,m,d){try{const b=new Date(1900,0,1),c=new Date(y,m-1,d);return getCycle(Math.floor((c-b)/86400000)+10);}catch{return getCycle(y+m+d)}}
function getMaxDay(y,m){return new Date(y,m,0).getDate()}
function fillYMD(yId,mId,dId, defY){
  const yS=document.getElementById(yId), mS=document.getElementById(mId), dS=document.getElementById(dId);
  if(!yS||!mS||!dS) return;

function getCounts(pillars){
  let c={목:0,화:0,토:0,금:0,수:0};
  pillars.forEach(p=>{if(p.gan!=="-"&&GAN_INFO[p.gan])c[GAN_INFO[p.gan].e]++; if(p.ji!=="-"&&JI_INFO[p.ji])c[JI_INFO[p.ji].e]++;});
  return c;
}
function getSinGang(counts, dayE, monthJi){
  let monthE=JI_INFO[monthJi]?.e;
  let support=counts[dayE]+ (counts[{목:"수",화:"목",토:"화",금:"토",수:"금"}[dayE]]||0)*0.7;
  if(monthE===dayE) support+=1.5;
  let total=Object.values(counts).reduce((a,b)=>a+b,0);
  return support >= total*0.45 ? "신강" : "신약";
}

  document.getElementById('sewoon2026').innerHTML='2026 병오년 - 화 최강 해 / '+myE+' 일간에게 '+(myE==='목'?'결과물 보여주는 해':myE==='화'?'이름 알리기 좋은 해':myE==='토'?'집·공부에 길':myE==='금'?'승진·책임':myE==='수'?'돈 버는 아이디어')+'<br>용신 '+(myE==='목'?'금':myE==='화'?'수':myE==='토'?'목':myE==='금'?'화':'토')+' 오는 대운 잡기';
  document.getElementById('todayResult').style.display='block';
});
</script>
