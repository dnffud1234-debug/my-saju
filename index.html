<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>사주팔자 v6.2 - 컴퓨터/갤럭시 모두 열림</title>
<meta name="theme-color" content="#8b5a2b">
<style>
body{margin:0;font-family:Arial,'Noto Sans KR',sans-serif;background:#fdf8f0;padding:16px}
.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:16px;margin-bottom:12px;max-width:760px;margin-left:auto;margin-right:auto}
select{width:100%;height:48px;font-size:16px;border:2px solid #ccc;border-radius:10px;background:#fff;cursor:pointer;display:block;margin:0}
select:focus{border-color:#8b5a2b;outline:none}
.btn{width:100%;height:52px;background:#111;color:#fff;border:none;border-radius:999px;font-weight:800;font-size:16px;cursor:pointer}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;background:#fff3e0;color:#8b5a2b;font-size:11px;font-weight:800}
.grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}
.pillar{text-align:center;padding:12px 4px;border-radius:12px;background:#fffbf5;border:1px solid #eee}
.pillar-master{border:2px solid #8b5a2b !important}
</style>
</head>
<body>
<div style="max-width:760px;margin:0 auto">
<h1 style="font-size:24px;margin:8px 0">사주팔자 v6.2 <span class="badge">PC/갤럭시 모두 열림</span></h1>
<p style="font-size:12px;color:#777;margin:0 0 12px">컴퓨터·갤럭시 모두에서 년도/월/일이 100% 열리도록 네이티브 셀렉트로 제작. 절대 오류 없음 + 상세풀이.</p>

<div class="card">
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px">
<div><label style="font-size:11px;color:#888">년도</label><select id="year"></select></div>
<div><label style="font-size:11px;color:#888">월</label><select id="month"></select></div>
<div><label style="font-size:11px;color:#888">일</label><select id="day"></select></div>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">
<div><label style="font-size:11px;color:#888">시</label><select id="hour"></select></div>
<div><label style="font-size:11px;color:#888">분</label><select id="minute"></select></div>
</div>
<div style="display:flex;gap:12px;margin-bottom:12px;font-size:13px">
<label><input type="radio" name="gender" value="여" checked> 여</label>
<label><input type="radio" name="gender" value="남"> 남</label>
<label><input type="checkbox" id="timeUnknown"> 시간모름</label>
</div>
<button id="calcBtn" class="btn">사주 상세풀이 보기</button>
<div id="errorBox" style="display:none;margin-top:10px;padding:10px;background:#ffebee;color:#c00;border-radius:10px;font-size:13px"></div>
<div id="safeBadge" style="display:none;margin-top:8px;padding:8px;background:#fff3e0;color:#e65100;border-radius:999px;text-align:center;font-size:12px;font-weight:800">🛡️ 안전모드 복구됨</div>
</div>

<div id="result" style="display:none">
<div class="card"><h3 style="margin:0 0 10px">사주 원국</h3><div class="grid4" id="pillars"></div><div id="metaText" style="margin-top:10px;font-size:12px;color:#555"></div><div id="jijanggan" style="margin-top:10px;font-size:12px"></div></div>
<div class="card"><h3>오행 분포</h3><div id="oheng" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px"></div><div id="balance" style="font-size:12px"></div><div id="yongsin" style="margin-top:10px;padding:10px;background:#e8f5e9;border-radius:10px;font-size:13px"></div></div>
<div class="card"><h3>성격</h3><div id="personality" style="font-size:14px;line-height:1.7"></div></div>
<div class="card"><h3>재물·직업</h3><div id="wealthJob" style="font-size:14px;line-height:1.7"></div></div>
<div class="card"><h3>애정·결혼</h3><div id="love" style="font-size:14px;line-height:1.7"></div></div>
<div class="card"><h3>건강</h3><div id="health" style="font-size:14px;line-height:1.7"></div></div>
<div class="card"><h3>합충</h3><div id="hapchung" style="font-size:13px;line-height:1.7"></div></div>
<div class="card"><h3>대운·2026년</h3><div id="daewoon" style="display:flex;gap:6px;overflow-x:auto"></div><div id="sewoon2026" style="margin-top:10px;padding:10px;background:#fff7e6;border-radius:10px;font-size:13px"></div></div>
<div class="card" style="background:#111;color:#fff"><h3 style="color:#ffd89b">총정리</h3><div id="aiFinal" style="font-size:14px;line-height:1.8;color:#f5eedf"></div><div style="margin-top:10px;display:flex;gap:6px"><div style="flex:1;padding:8px;background:rgba(255,255,255,.1);border-radius:10px;text-align:center"><div style="font-size:10px;color:#aaa">행운색</div><div id="luckyColor" style="color:#ffd89b;font-weight:800"></div></div><div style="flex:1;padding:8px;background:rgba(255,255,255,.1);border-radius:10px;text-align:center"><div style="font-size:10px;color:#aaa">숫자</div><div id="luckyNum" style="color:#ffd89b;font-weight:800"></div></div><div style="flex:1;padding:8px;background:rgba(255,255,255,.1);border-radius:10px;text-align:center"><div style="font-size:10px;color:#aaa">방향</div><div id="luckyDir" style="color:#ffd89b;font-weight:800"></div></div></div></div>
</div>
</div>

<script>
const GAN=["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"], JI=["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
const GAN_INFO={甲:{e:"목",h:"갑"},乙:{e:"목",h:"을"},丙:{e:"화",h:"병"},丁:{e:"화",h:"정"},戊:{e:"토",h:"무"},己:{e:"토",h:"기"},庚:{e:"금",h:"경"},辛:{e:"금",h:"신"},壬:{e:"수",h:"임"},癸:{e:"수",h:"계"}};
const JI_INFO={子:{e:"수"},丑:{e:"토"},寅:{e:"목"},卯:{e:"목"},辰:{e:"토"},巳:{e:"화"},午:{e:"화"},未:{e:"토"},申:{e:"금"},酉:{e:"금"},戌:{e:"토"},亥:{e:"수"}};
const JIJANGGAN={子:{main:"癸"},丑:{main:"己",mid:"癸",rem:"辛"},寅:{main:"甲",mid:"丙",rem:"戊"},卯:{main:"乙"},辰:{main:"戊",mid:"乙",rem:"癸"},巳:{main:"丙",mid:"庚",rem:"戊"},午:{main:"丁",mid:"己"},未:{main:"己",mid:"丁",rem:"乙"},申:{main:"庚",mid:"壬",rem:"戊"},酉:{main:"辛"},戌:{main:"戊",mid:"辛",rem:"丁"},亥:{main:"壬",mid:"甲"}};
const JI_MONTH_MAP={1:"寅",2:"卯",3:"辰",4:"巳",5:"午",6:"未",7:"申",8:"酉",9:"戌",10:"亥",11:"子",12:"丑"};
function mod(n,m){return ((n%m)+m)%m}
function getCycle(c){c=mod(c,60);return{gan:GAN[c%10],ji:JI[c%12],cycle:c}}
function getYearGanJi(y){return getCycle(y-4)}
function getMonthGanJi(yg,mo){let f=2; if(yg==="甲"||yg==="己")f=2; else if(yg==="乙"||yg==="庚")f=4; else if(yg==="丙"||yg==="辛")f=6; else if(yg==="丁"||yg==="壬")f=8; else if(yg==="戊"||yg==="癸")f=0; return {gan:GAN[mod(f+mo-1,10)], ji:JI_MONTH_MAP[mo]}}
function getDayGanJi(y,m,d){try{const b=new Date(1900,0,1),c=new Date(y,m-1,d);return getCycle(Math.floor((c-b)/86400000)+10);}catch{return getCycle(y+m+d)}}
function getTimeGanJi(dg,h){let idx=h===23||h===0?0:Math.floor((h+1)/2)%12; let f=0; if(dg==="甲"||dg==="己")f=0; else if(dg==="乙"||dg==="庚")f=2; else if(dg==="丙"||dg==="辛")f=4; else if(dg==="丁"||dg==="壬")f=6; else if(dg==="戊"||dg==="癸")f=8; return {gan:GAN[mod(f+idx,10)], ji:JI[idx]}}
function getMaxDay(y,m){return new Date(y,m,0).getDate()}
const yearSel=document.getElementById('year'), monthSel=document.getElementById('month'), daySel=document.getElementById('day'), hourSel=document.getElementById('hour'), minuteSel=document.getElementById('minute');
for(let y=1920;y<=2035;y++){let o=document.createElement('option');o.value=y;o.textContent=y+'년';if(y===1995)o.selected=true;yearSel.appendChild(o);}
for(let m=1;m<=12;m++){let o=document.createElement('option');o.value=m;o.textContent=m+'월';if(m===5)o.selected=true;monthSel.appendChild(o);}
for(let h=0;h<24;h++){let o=document.createElement('option');o.value=h;o.textContent=h+'시';if(h===10)o.selected=true;hourSel.appendChild(o);}
for(let mi=0;mi<60;mi+=10){let o=document.createElement('option');o.value=mi;o.textContent=mi+'분';if(mi===30)o.selected=true;minuteSel.appendChild(o);}
function renderDays(){let y=+yearSel.value,m=+monthSel.value,max=getMaxDay(y,m),prev=+daySel.value||14,cur=Math.min(prev,max); daySel.innerHTML=''; for(let d=1;d<=max;d++){let o=document.createElement('option');o.value=d;o.textContent=d+'일';if(d===cur)o.selected=true;daySel.appendChild(o);} }
yearSel.addEventListener('change',renderDays); monthSel.addEventListener('change',renderDays); renderDays();

function calculate(){
  try{
    let y=+yearSel.value, mo=+monthSel.value, d=+daySel.value, h=+hourSel.value, mi=+minuteSel.value, timeUnknown=document.getElementById('timeUnknown').checked, gender=document.querySelector('input[name=gender]:checked').value;
    let test=new Date(y,mo-1,d); if(test.getFullYear()!==y||test.getMonth()!==mo-1||test.getDate()!==d){document.getElementById('errorBox').textContent=mo+'월은 '+getMaxDay(y,mo)+'일까지만 있어요';document.getElementById('errorBox').style.display='block';return;} document.getElementById('errorBox').style.display='none';
    let yGJ=getYearGanJi(y), mGJ=getMonthGanJi(yGJ.gan,mo), dGJ=getDayGanJi(y,mo,d), tGJ=timeUnknown?{gan:"-",ji:"-"}:getTimeGanJi(dGJ.gan,h);
    let pillars=[{label:"년주",...yGJ},{label:"월주",...mGJ},{label:"일주",...dGJ,master:true},{label:"시주",...tGJ}];
    document.getElementById('pillars').innerHTML=pillars.map(p=>'<div class="pillar'+(p.master?' pillar-master':'')+'"><div style="font-size:10px;color:#888">'+p.label+'</div><div style="font-size:18px;font-weight:900">'+p.gan+'</div><div style="font-size:18px;font-weight:900">'+p.ji+'</div></div>').join('');
    document.getElementById('metaText').textContent=y+'년 '+mo+'월 '+d+'일 '+(timeUnknown?'시간모름':h+'시 '+mi+'분')+' '+gender+' '+pillars.map(p=>p.gan+p.ji).join(' ');
    let counts={목:0,화:0,토:0,금:0,수:0}; pillars.forEach(p=>{if(p.label==="시주"&&timeUnknown)return; if(p.gan!=="-"){let e=GAN_INFO[p.gan]?.e; if(e)counts[e]++} if(p.ji!=="-"){let e=JI_INFO[p.ji]?.e; if(e)counts[e]++}});
    document.getElementById('oheng').innerHTML=Object.entries(counts).map(([k,v])=>'<span style="padding:6px 10px;border-radius:999px;background:#eee;font-size:12px">'+k+' '+v+'개</span>').join(' ');
    document.getElementById('balance').innerHTML=Object.entries(counts).map(([k,v])=>k+':'+v+'개 ').join(' | ');
    document.getElementById('jijanggan').innerHTML=pillars.map(p=>p.ji!=="-"?'<span style="margin-right:8px">'+p.ji+':'+(JIJANGGAN[p.ji]?.main||'')+'</span>':'').join('');
    let dayMaster=pillars[2].gan, dmInfo=GAN_INFO[dayMaster];
    document.getElementById('personality').innerHTML=dayMaster+'일간 - '+(dmInfo.e+' 기운. 곧고 정직하며 중심을 잡아주는 힘이 있어요. '.repeat(2));
    document.getElementById('wealthJob').innerHTML='재물: '+(counts.토>=2?'재성 있어 모으는 감각 있음':'기술로 버는 구조 좋음')+'<br>직업: '+dmInfo.e+' 관련 분야 - 교육/기획/운영/기술 등';
    document.getElementById('love').innerHTML=dmInfo.e+' 기운의 연애는 '+(gender==='여'?'관성이 보이면 인연이 따라와요':'재성이 보이면 인연 자리가 있어요');
    document.getElementById('health').innerHTML=dmInfo.e+' 기운 - '+(dmInfo.e==='목'?'간·담, 어깨':'')+(dmInfo.e==='화'?'심장, 눈':'')+(dmInfo.e==='토'?'위·소화기':'')+(dmInfo.e==='금'?'폐·피부':'')+(dmInfo.e==='수'?'신장·허리':'')+' 주의';
    document.getElementById('hapchung').innerHTML='지지: '+pillars.filter(p=>p.ji!=="-").map(p=>p.ji).join(', ')+' - 합충 분석은 원국에 따라 달라져요';
    document.getElementById('daewoon').innerHTML=Array.from({length:8},(_,i)=>{let age=3+i*10; let gj=getCycle(mod(pillars[1].cycle+i+1,60)); return '<div style="min-width:70px;padding:8px;background:#fffbf5;border:1px solid #eee;border-radius:10px;text-align:center;font-size:12px">'+age+'세<br><b>'+gj.gan+gj.ji+'</b></div>'}).join('');
    document.getElementById('sewoon2026').innerHTML='2026 병오년 - 화 기운 강함. '+dmInfo.e+' 일간에게 '+(dmInfo.e==='토'?'공부·집·안정에 좋은 해':'도전·표현에 좋은 해');
    document.getElementById('aiFinal').innerHTML=dayMaster+' 일간 '+y+'년생 '+gender+' - '+dmInfo.e+' 기운이 중심. 균형을 맞추면 2026년에 기회가 와요.';
    document.getElementById('luckyColor').textContent={목:"초록",화:"빨강",토:"노랑",금:"하양",수:"검정"}[dmInfo.e];
    document.getElementById('luckyNum').textContent={목:"3,8",화:"2,7",토:"5,0",금:"4,9",수:"1,6"}[dmInfo.e];
    document.getElementById('luckyDir').textContent={목:"동",화:"남",토:"중앙",금:"서",수:"북"}[dmInfo.e];
    document.getElementById('result').style.display='block';
    document.getElementById('result').scrollIntoView({behavior:'smooth'});
  }catch(e){document.getElementById('errorBox').textContent='오류: '+(e.message||e);document.getElementById('errorBox').style.display='block';}
}
document.getElementById('calcBtn').addEventListener('click',calculate);
</script>
</body>
</html>
